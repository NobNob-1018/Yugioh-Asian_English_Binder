  /* The keyframes run from dimmed-and-tilted back to rest, so a browser that
     never composites them would leave the page mid-turn. Dropping the class
     shortly after restores the static state, which is the correct one.   */
  if(dir){const g=grid;setTimeout(()=>g.classList.remove('tl','tr'),420);}
  grid.innerHTML='';

  const st=$('#binder-state');st.innerHTML='';
  if(!list.length){
    if(!poolReady&&!F.ownedOnly)st.appendChild(el('div','state','<div class="spin"></div><b>Loading the OCG pool</b>Every card with an OCG release is on its way in.'));
    else if(dk)st.appendChild(el('div','state','<b>This deck is empty</b>Nothing is tagged to it. Deck tagging is off for now, so this list stays empty.'));
    else if(VIEW==='wants')st.appendChild(el('div','state','<b>Nothing on the wishlist</b>Open any card and use Add to wishlist to start tracking it across both shops.'));
    else if(F.ownedOnly&&!Object.keys(DB.own).length)st.appendChild(el('div','state','<b>Nothing marked as owned yet</b>Turn off \u201cShow owned\u201d to page through the pool, then set copies on any card you have.'));
    else if(bn&&!F.ownedOnly)st.appendChild(el('div','state',`<b>Nothing in ${esc(bn.name)} yet</b>Open a card and use Keep / Sell on a copy to file it here.`));
    else st.appendChild(el('div','state','<b>No cards match these filters</b>Use Clear filters, or tap the \u00d7 beside the heading.'));
  }

  for(let i=0;i<PER;i++){
    const c=slice[i];
    if(!c){const sl=el('div','slot');sl.appendChild(el('div','pocket pocket-empty','<span>\u25c7</span><span class="sleeve"></span>'));sl.appendChild(el('div','cap-row'));grid.appendChild(sl);continue;}
    /* Greyed out means "not in the binder you are looking at". Owning a card in
       Collection must not make it look present in Selling; the two are kept
       apart everywhere else, and this was the one place they leaked.      */
    const inView=totalCopies(c.id), held=inView;
    const slot=el('div','slot');
    const p=el('button','pocket filled'+(held||VIEW==='wants'?'':' unowned'));
    const code=[...new Set(copiesIn(c.id).map(x=>x.set).filter(Boolean))][0]||'';
    const ask=valueOf(c.id);
    let badge;
    const wnt=VIEW==='wants'?wantOf(c.id):null;
    if(wnt){
      /* the number that matters here is the price, not how many you hold */
      const q=wantQuote(c.id),met=wantMet(c.id);
      badge=`<span class="qty want${met?' met':''}">${q?esc(peso(q.peso)):'\u2014'}</span>`;
      p.setAttribute('aria-label',c.name+', wanted'+(met?', at or under target':''));
    }else if(inView){
      const held=isSelling(bn)?reservedFor(c.id):0;
      badge=held>0
        ? `<span class="qty part" title="${held} reserved by a pending deal">${inView-held}/${inView}</span>`
        : `<span class="qty">\u00d7${inView}</span>`;
      p.setAttribute('aria-label',c.name+', owned'+(held?', '+held+' reserved':''));
    }else{
      badge='<span class="add">+</span>';
      p.setAttribute('aria-label',c.name+', not owned');
    }
    /* the scrim is only worth drawing where something sits on the art */
    if(inView||(VIEW==='wants'&&wantOf(c.id)))p.classList.add('has-badge');
    const r=topRarity(c.id);
    /* The rarity you actually hold drives the sleeve: a ring for anything
       above Rare, and a coloured band for the foils.                    */
    if(r&&r.k){
      p.dataset.r=r.k;
      if(r.w>=3)p.classList.add('shiny');
      if(r.w>=6)p.classList.add('foil');
    }
    p.innerHTML=`<img src="${esc(c.img)}" alt="" loading="lazy" onerror="this.classList.add('bad')">
      <span class="glare"></span><span class="sleeve"></span>
      ${badge}`;
    p.onclick=()=>openDetail(c.id);
    slot.appendChild(p);
    const chg=changeOf(c.id);
    /* Set code and rarity sit here rather than over the art: the picture stays
       clean, and the caption stops being a wide strip holding one number.    */
    const cap=el('div','cap-row');
    /* Priced it yourself? Then the useful comparison is against TCG Corner, not
       against last week's figure, so the SRP gap takes the slot the price-change
       arrow normally sits in.                                                */
    const srpTot=pricedByHand(c.id)?srpValueOf(c.id):null;
    let tailBit='';
    if(srpTot&&srpTot>0){
      const dd=(ask-srpTot)/srpTot*100;
      const gcls=dd<-0.5?'up':(dd>0.5?'down':'flat');
      tailBit=`<s class="cap-srp">${esc(peso(srpTot))}</s><span class="cap-g ${gcls}">${dd>0?'+':''}${Math.round(dd)}%</span>`;
    }else if(chg){
      tailBit=`<span class="cap-d ${chg>0?'up':'down'}">${chg>0?'\u25b2':'\u25bc'}${esc(peso(Math.abs(chg)))}</span>`;
    }
    let money;
    if(ask){
      /* with room to spare, show what one copy is worth beside the stack total */
      const heldQty=copiesIn(c.id).reduce((n,cp)=>n+(+cp.qty||0),0);
      const each=heldQty>1?`<span class="cap-ea">${esc(peso(ask/heldQty))} ea</span>`:'';
      money=`${each}<span class="cap-p">${esc(peso(ask))}</span>${tailBit}`;
    }else{
      const rg=srpRange(c);
      money=rg
        ? `<span class="cap-p dim">${rg.n>1?'from ':''}${esc(peso(rg.lo))}</span>`
        : (c.usd?`<span class="cap-p dim" title="No TCG Corner listing; English market estimate">${esc(peso(c.usd*fx()))}\u00a0est</span>`:'');
    }
    /* One chip per rarity you actually hold, so a second printing of the same
       card is visible from the grid rather than only inside the panel.      */
    const heldR=[...new Set(copiesIn(c.id).map(x=>x.rarity).filter(Boolean))]
      .map(k=>rarBy(k)).sort((a,b)=>b.w-a.w);
    const show=heldR.length?heldR:(r?[r]:[]);
    const chips=show.slice(0,2).map(x=>`<i class="cap-r ${x.f}" title="${esc(x.n)}">${esc(x.k)}</i>`).join('')+
      (show.length>2?`<i class="cap-more" title="${esc(show.slice(2).map(x=>x.n).join(', '))}">+${show.length-2}</i>`:'');
    cap.innerHTML=`<span class="cap-id">${chips}`+
      `${code?`<i class="cap-s">${esc(code)}</i>`:''}</span><span class="cap-v">${money}</span>`;
    slot.appendChild(cap);
    grid.appendChild(slot);
  }

  $('#jump').value=page+1;
  $('#of').textContent='/ '+pages.toLocaleString();
  $('#prev').disabled=page===0;
  $('#next').disabled=page>=pages-1;
  /* One heading, not a heading plus a chip repeating it. When you are inside a
     set, core or deck the heading turns accent and grows its own way out. */
  const tag=$('#page-tag');
  const drill=F.arch?{t:F.arch+' core',clr:()=>{F.arch='';},b:'Back to all cores'}
    :F.set?{t:(F.set==='\u2014'?'No set code':'Set '+F.set),clr:()=>{F.set='';},b:'Back to all sets'}
    :null;
  tag.classList.toggle('drill',!!drill);
  if(drill){
    tag.innerHTML=`<span>${esc(drill.t)}</span><button title="${drill.b}">\u00d7</button>`;
    tag.querySelector('button').onclick=()=>{drill.clr();page=0;renderBinder();};
  }else if(VIEW==='wants')tag.textContent='Wishlist';
  else tag.textContent=bn?bn.name:(F.ownedOnly?'Collection':'Full OCG pool');

  if(VIEW==='wants'){
    const t=wantTotals();
    $('#count').textContent=t.cards+' want'+(t.cards===1?'':'s')+
      (t.quoted?' \u00b7 '+peso(t.now)+' to buy'+(t.met?' \u00b7 '+t.met+' at target':''):'');
  }else{
    const copies=list.reduce((s,c)=>s+totalCopies(c.id),0);
    if(F.set||F.arch){
      /* inside a set or core the useful number is how far along you are */
      const have=list.filter(c=>copiesIn(c.id).length).length;
      const pct=list.length?Math.round(have/list.length*100):0;
      $('#count').textContent=have+' / '+list.length+' cards \u00b7 '+pct+'%'+(copies?' \u00b7 '+copies+' copies':'');
    }else{
      const cw=list.length===1?' card':' cards';
      const pw=copies===1?' copy':' copies';
      $('#count').textContent=list.length.toLocaleString()+cw+(copies?' \u00b7 '+copies+pw:'');
    }
  }

  /* The asking total and its margin live on the dashboard now, and the sale list
     sits with the other export actions, so nothing on this bar appears or
     vanishes when you switch binders and nothing shifts sideways.          */
  const saleBtn=$('#do-sale');
  if(saleBtn)saleBtn.hidden=!(binderValue('b-sell')>0);

  paintBinders();
}

/* What the whole core would cost at TCG Corner's cheapest clean printing of
   each card, times however many of each you want. Shown on the selling shelf
   only, beside what the copies you actually hold are worth.              */
const coreMult=()=>Math.min(3,Math.max(1,+DB.coreMult||1));
function estText(g){
  if(F.binder!=='b-sell'||!g.quoted)return '';
  return '  \u00d7'+coreMult()+' est '+peso(g.est*coreMult());
}
function estLine(g){
  if(F.binder!=='b-sell')return '';
  if(!g.quoted)return '<div class="est none">No AE price on file</div>';
  const miss=g.total-g.quoted;
  const t='Cheapest clean AE printing of each card \u00d7'+coreMult()+
    (miss?', '+miss+' of '+g.total+' not stocked':'');
  return '<div class="est" title="'+esc(t)+'">'+
    '<span>est \u00d7'+coreMult()+'</span><b>'+esc(peso(g.est*coreMult()))+'</b>'+
    (g.owned?'<span class="own">owned '+esc(peso(g.value))+'</span>':'')+
    '</div>';
}

/* Counts a figure up to its new value. Purely presentational: the text is set
   to the final value first, so if anything interrupts, the number is right.
   Honours prefers-reduced-motion, and skips a first paint or a large jump
   where a spinning number would just be noise.                          */
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const ROLL=new Map();
function rollTo(node,key,value,fmt){
  const from=ROLL.get(key);
  ROLL.set(key,value);
  node.textContent=fmt(value);
  if(REDUCED||from==null||from===value)return;
  const span=Math.abs(value-from);
  if(span<1||span/Math.max(1,Math.abs(value))>3)return;   /* first load, or a wholesale change */
  const t0=performance.now(),ms=520;
  const step=now=>{
    const k=Math.min(1,(now-t0)/ms);
    const e=1-Math.pow(1-k,3);
    node.textContent=fmt(from+(value-from)*e);
    if(k<1)requestAnimationFrame(step);else node.textContent=fmt(value);
  };
  requestAnimationFrame(step);
}
function paintDash(){

  const d=$('#dash');if(!d)return;
  const keep=binderValue('b-main'), sell=binderValue('b-sell');
  const selling=F.binder==='b-sell';
  const val=selling?sell:keep;
  const h=DB.history||[];
  const prev=h.length>1?h[h.length-2].v:null;
  const diff=prev==null?null:totalValue()-prev;
  const cls=diff==null?'flat':(diff>0.5?'up':(diff<-0.5?'down':'flat'));
  const arrow=diff==null?'no earlier snapshot':(diff>0?'\u25b2 ':(diff<0?'\u25bc ':''))+
    (diff?peso(Math.abs(diff))+' since last session':'no change');
  /* A pending deal does not reduce what you own, so this sits beside the
     totals rather than inside them.                                     */
  const rsv=reservedValue();
  const M=sellMargin();
  let mg;
  if(!M.n)mg='<b class="muted">\u2014</b><div class="sub2">nothing listed yet</div>';
  else if(M.srp<=0)mg='<b class="muted">\u2014</b><div class="sub2">no TCG Corner price to compare</div>';
  else{
    const pc=(M.ask-M.srp)/M.srp*100;
    const mc=pc<-0.5?'up':(pc>0.5?'down':'flat');
    mg='<b class="'+mc+'">'+(pc>0?'+':'')+Math.round(pc)+'%</b>'+
       '<div class="sub2">'+esc(peso(M.ask))+' asked \u00b7 '+esc(peso(M.srp))+' SRP</div>';
  }
  const B=biggestMover();
  const mv=B
    ? '<b class="'+(B.d>0?'up':'down')+'">'+(B.d>0?'\u25b2':'\u25bc')+esc(peso(Math.abs(B.d)))+'</b>'+
      '<div class="sub2" title="'+esc(B.name)+'">'+esc(B.name)+'</div>'
    : '<b class="muted">\u2014</b><div class="sub2">no earlier prices yet</div>';
  d.innerHTML=`
    <div>
      <div class="cap">${selling?'Selling value':'Collection value'}</div>
      <div class="big">${esc(peso(val))}</div>
      <div class="delta ${cls}">${esc(arrow)}</div>
    </div>
    <div class="cell"><div class="cap">Total assets</div><b>${esc(peso(keep+sell))}</b>${rsv>0?`<div class="sub2" title="Held by pending deals">${esc(peso(rsv))} reserved</div>`:''}
      <div class="sub2">${esc(peso(keep))} kept \u00b7 ${esc(peso(sell))} listed</div></div>
    <div class="cell"><div class="cap">Against SRP</div>${mg}</div>
    <div class="cell"><div class="cap">Biggest mover</div>${mv}</div>
`;
  const big=d.querySelector('.big');
  if(big)rollTo(big,'headline:'+F.binder,val,peso);
  const tot=d.querySelector('.cell b');
  if(tot)rollTo(tot,'total',keep+sell,peso);
  paintTopTools();}
/* The sidebar folds away so the cards get the full width. Remembered in the
   collection file, so it stays how you left it next time.                  */
/* keep the bar's controls in step, and hide them on the tile boards where a
   card sort and a card/list switch would mean nothing                     */
/* One bar, three contexts: a page of cards, the Sets board, the Cores board.
   The sort menu swaps to match, and rarity only shows where cards do.      */
function paintTools(showingCards){
  const board=!showingCards&&(VIEW==='sets'||VIEW==='cores');
  const ts=document.querySelector('.toolset');

/* ---- binder mode ----

   strip that stays out of the way until you sweep to the top of the screen.
   Nothing is duplicated, so every control keeps the handler it already had. */
let BM=false, BM_HOME=null, BM_PREV_SPREAD=false, BM_PEEK=null, BM_PREV_PER=0;
const bmChrome=()=>document.getElementById('bm-chrome');
function enterBinderMode(){

/* The leaf is laid over a page that has already been redrawn, so if the

function bmFlip(dir){

/* ---- paste a list ----
   Typing cards in one at a time is what kills a collection tracker, so this
   takes whatever shape a list already has - a deck export, a shop receipt, a
   note to yourself - and resolves it against the catalogue. Nothing is written
   until you have seen what each line matched.                             */
const PASTE_RAR={C:'C',COM:'C',COMMON:'C',N:'C',R:'R',RARE:'R',
  SR:'SR',SUPER:'SR',UR:'UR',ULTRA:'UR',UL:'UtR',UTR:'UtR',ULT:'UtR',ULTIMATE:'UtR',
  SCR:'ScR',SER:'ScR',SE:'ScR',SECRET:'ScR',
  EXSR:'ExSR',EXSER:'ExSR',PSCR:'PScR',PSER:'PScR',PSE:'PScR',PRISMATIC:'PScR',
  QCSR:'QCSR',QCSE:'QCSR',CR:'CR',COLLECTOR:'CR',HGR:'HGR',HOLO:'HGR'};
/* One line in, one intention out. Order matters: the code is the strongest
   signal, so it is pulled before anything is guessed from the words.      */
function parsePasteLine(raw){
  let s=String(raw||'').replace(/[​-‏﻿]/g,'').trim();
  if(!s||/^[#/]/.test(s))return null;               /* comments and blanks */
  s=s.replace(/^[-*•]\s*/,'');                 /* bullet lists */
  let qty=1;
  const lead=s.match(/^(\d{1,3})\s*[x×*]?\s+/i);
  if(lead){qty=+lead[1];s=s.slice(lead[0].length);}
  else{
    const tail=s.match(/\s*[x×*]\s*(\d{1,3})\s*$/i);
    if(tail){qty=+tail[1];s=s.slice(0,tail.index);}
  }
  let code='',set='',rar='';
  const cm=s.match(/\b([A-Z0-9]{2,6}-AE[SC]?\d{2,3})\b/i);
  if(cm){code=cm[1].toUpperCase();set=code;s=s.replace(cm[0],' ');}
  /* a rarity in brackets, or a bare token at either end */
  const bm=s.match(/[([]\s*([A-Za-z]{1,10})\s*[)\]]/);
  if(bm&&PASTE_RAR[bm[1].toUpperCase()]){rar=PASTE_RAR[bm[1].toUpperCase()];s=s.replace(bm[0],' ');}
  if(!rar){
    const tm=s.match(/\s+([A-Za-z]{1,6})\s*$/);
    if(tm&&PASTE_RAR[tm[1].toUpperCase()]){rar=PASTE_RAR[tm[1].toUpperCase()];s=s.slice(0,tm.index);}
  }
  if(!set){
    const sm=s.match(/\b([A-Z0-9]{2,5})\b\s*$/);
    if(sm&&aeSets&&aeSets().has(sm[1].toUpperCase())){set=sm[1].toUpperCase();s=s.slice(0,sm.index);}
  }
  const name=s.replace(/\s+/g,' ').replace(/^[\s\-:,]+|[\s\-:,]+$/g,'');
  if(!name&&!code)return null;
  return {raw,qty:Math.max(1,Math.min(99,qty)),name,code,set,rar};
}
/* The catalogue is keyed by set prefix, not by full card code, so a code is
   resolved through the price tables - they are the only thing that knows
   which card a code belongs to.                                           */
let PASTE_CODE=null;
function pasteCodeIndex(){
  if(PASTE_CODE)return PASTE_CODE;
  PASTE_CODE=new Map();
  PX_ROWS.forEach(r=>{if(r.code&&r.name&&!PASTE_CODE.has(r.code))PASTE_CODE.set(r.code,r.name);});
  pcIndex();
  PC_BY_CODE.forEach(r=>{if(r.code&&r.name&&!PASTE_CODE.has(r.code))PASTE_CODE.set(r.code,r.name);});
  return PASTE_CODE;
}
/* Resolve to a real card. A code is trusted over a name, because a name can be
   ambiguous and a code cannot.                                            */
function resolvePaste(p){
  let card=null,how='';
  if(p.code){
    const nm=pasteCodeIndex().get(p.code);
    if(nm){card=allCards().find(c=>nameKey(c.name)===nameKey(nm))||null;if(card)how='code';}
  }
  if(!card&&p.name){
    const k=nameKey(p.name);
    card=allCards().find(c=>nameKey(c.name)===k)||null;
    if(card)how='name';
    if(!card){
      const hits=allCards().filter(c=>nameKey(c.name).startsWith(k));
      if(hits.length===1){card=hits[0];how='partial name';}
    }
  }
  return card?Object.assign({},p,{card,how}):Object.assign({},p,{card:null,how:''});
}

/* ---- trade calculator ----
   The sum you do in your head over Messenger, done against real prices. What
   you put up comes from cards you actually hold, so a trade cannot be built
   from cards you do not have; what you are asking for is priced at whichever
   shop is cheaper, the same figure the rest of the app quotes.            */
function tradeValue(row){
  const c=cardById(row.id); if(!c)return 0;
  if(row.price!=null)return (+row.price)*row.qty;
  const b=bestMatch({set:row.set||'',rarity:row.rar||'',qty:1},c);
  return (b?b.peso:0)*row.qty;
}
/* ---- deals ----
   A buyer works through a shared binder, sends an order code, and it lands
   here as a pending deal. Nothing is moved or deleted: copies stay where they
   are and a deal merely *claims* some of them, so postponing one is a status
   change rather than an attempt to put inventory back exactly as it was.

   Only ticked items in a pending deal hold stock. Untick a line and those
   copies are free again immediately, which is what makes a deal editable
   while it is still being negotiated.                                     */
const ORDER_CODE='YGOD1.';
const dealsAll=()=>DB.deals2||(DB.deals2=[]);
/* copiesIn() answers for whichever binder is open, but a deal is always
   against the selling shelf - reading it through copiesIn made reservations
   read as zero whenever the Collection happened to be on screen.        */
const sellCopies=id=>{const o=DB.own[id];
  return o?(o.copies||[]).filter(c=>c.b==='b-sell'):[];};
const dealById=id=>dealsAll().find(d=>d.id===id)||null;
const copyKey=(rar,set)=>String(rar||'C')+'|'+String(set||'');

/* How many of one printing are spoken for right now. */
function reservedQty(cardId,rar,set){
  const k=copyKey(rar,set);
  return dealsAll().reduce((s,d)=>{
    if(d.status!=='pending')return s;
    return s+(d.items||[]).reduce((t,it)=>
      (it.agreed!==false&&String(it.id)===String(cardId)&&copyKey(it.rar,it.set)===k)
        ? t+(+it.qty||0) : t,0);
  },0);
}
const reservedFor=id=>sellCopies(id).reduce((s,cp)=>s+reservedQty(id,cp.rarity,cp.set),0);
/* What is still free to promise to somebody else. Deliberately separate from
   copiesIn: the twenty-odd places that ask "what do I own" should keep saying
   the same thing, while only sharing and exports ask "what can I still sell". */
function freeCopiesIn(id){
  return copiesIn(id).map(cp=>{
    const free=(+cp.qty||0)-reservedQty(id,cp.rarity,cp.set);
    return free>0?Object.assign({},cp,{qty:free}):null;
  }).filter(Boolean);
}
const freeTotal=id=>freeCopiesIn(id).reduce((s,x)=>s+(+x.qty||0),0);
/* Everything reserved across the shelf, as a figure for the dashboard. */
function reservedValue(){
  let v=0;
  Object.keys(DB.own||{}).forEach(id=>{
    const c=cardById(id); if(!c)return;
    sellCopies(id).forEach(cp=>{
      const q=reservedQty(id,cp.rarity,cp.set);
      if(q>0)v+=copyValue(cp,c)*q;
    });
  });
  return v;
}
const dealValue=d=>(d.items||[]).reduce((s,it)=>
  s+(it.agreed===false?0:(+it.price||0)*(+it.qty||0)),0);

/* ---- the order code ---- */
function readOrder(code){
  const raw=String(code||'').replace(/\s+/g,'');
  const i=raw.indexOf(ORDER_CODE);
  if(i<0)throw new Error('not an order code');
  const p=JSON.parse(b64dec(raw.slice(i+ORDER_CODE.length)));
  if(!p||!Array.isArray(p.items))throw new Error('not an order code');
  return {who:String(p.who||'A buyer').slice(0,60),
    contact:String(p.contact||'').slice(0,120),
    note:String(p.note||'').slice(0,400),
    offer:p.offer==null?null:+p.offer,
    items:p.items.map(x=>({id:String(x[0]),rar:x[1]||'',set:x[2]||'',
      qty:Math.max(1,+x[3]||1),price:x[4]==null?0:+x[4],agreed:true}))};
}
/* Which lines would promise more than is left, and to whom the rest is owed. */
function orderConflicts(order){
  const out=[];
  (order.items||[]).forEach(it=>{
    const held=sellCopies(it.id).filter(cp=>copyKey(cp.rarity,cp.set)===copyKey(it.rar,it.set))
      .reduce((s,cp)=>s+(+cp.qty||0),0);
    const taken=reservedQty(it.id,it.rar,it.set);
    const free=held-taken;
    if(it.qty>free){
      const holders=dealsAll().filter(d=>d.status==='pending'&&
        (d.items||[]).some(x=>x.agreed!==false&&String(x.id)===String(it.id)&&
          copyKey(x.rar,x.set)===copyKey(it.rar,it.set))).map(d=>d.who);
      const c=cardById(it.id);
      out.push({name:c?c.name:it.id,rar:it.rar,set:it.set,
        want:it.qty,free:Math.max(0,free),held,holders});
    }
  });
  return out;
}
function addDeal(order,trim){
  const d={id:'k'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    who:order.who,contact:order.contact,note:order.note,offer:order.offer,
    created:Date.now(),status:'pending',items:order.items.map(x=>Object.assign({},x))};
  if(trim){
    /* accept only what is actually free, line by line */
    d.items.forEach(it=>{
      const held=sellCopies(it.id).filter(cp=>copyKey(cp.rarity,cp.set)===copyKey(it.rar,it.set))
        .reduce((s,cp)=>s+(+cp.qty||0),0);
      const free=held-reservedQty(it.id,it.rar,it.set);
      if(it.qty>free){it.qty=Math.max(0,free);if(!it.qty)it.agreed=false;}
    });
  }
  dealsAll().unshift(d);save();
  return d;
}

          /* whichever printing is cheapest is the sensible opening guess */
          const card=cardById(o.id);
          const rs=card?printingsOf(card).rars:[];
          let best=null,bp=Infinity;
          rs.forEach(k=>{const m=bestMatch({set:'',rarity:k,qty:1},card);
            if(m&&m.peso<bp){bp=m.peso;best=k;}});
          rar=best||rs[0]||'C';
        }
        S[side].push({id:o.id,rar,set:o.set,price:o.price,qty:1});
        body.querySelector('#t-'+side+'-q').value='';hits.innerHTML='';
        draw(side);total();
      };
      hits.appendChild(b);

/* ---- deals panel ----

   with the deal already holding those copies, and the choice is yours.    */
function openDeals(){
  const box=el('div');
  box.innerHTML=
    '<div class="sh">Take in an order</div>'+
    '<textarea class="tf-code" id="d-in" rows="3" placeholder="'+ORDER_CODE+'…"></textarea>'+

  const body=modal('Deals',box,true);
  const chk=body.querySelector('#d-check');

  const list=()=>{
    const host=body.querySelector('#d-list');host.innerHTML='';
    const ds=dealsAll();
    if(!ds.length){host.appendChild(el('p','note',
      'Nothing yet. When a buyer sends an order code from a binder you shared, paste it above.'));return;}
    ds.forEach(d=>{
      const wrap=el('div','deal '+d.status);
      const items=(d.items||[]).map((it,i)=>{
        const c=cardById(it.id);
        return '<label class="ditem'+(it.agreed===false?' off':'')+'">'+
          '<input type="checkbox" data-i="'+i+'"'+(it.agreed===false?'':' checked')+'>'+
          '<span class="r '+esc(rarBy(it.rar||'C').f)+'">'+esc(it.rar||'C')+'</span>'+
          '<span class="dn">'+esc(c?c.name:it.id)+'</span>'+
          '<span class="pm">'+esc(it.set||'')+'</span>'+
          '<span class="dq">×'+it.qty+'</span>'+
          '<b>'+esc(peso((+it.price||0)*(+it.qty||0)))+'</b></label>';
      }).join('');
      const when=new Date(d.created).toISOString().slice(0,10);
      wrap.innerHTML=
        '<div class="dhead"><span class="dwho">'+esc(d.who)+'</span>'+
        '<span class="dstat '+d.status+'">'+d.status+'</span>'+
        '<span class="pm">'+when+'</span>'+
        '<b class="dval">'+esc(peso(dealValue(d)))+'</b></div>'+
        (d.contact?'<div class="note dcontact">'+esc(d.contact)+'</div>':'')+
        (d.note?'<div class="note">“'+esc(d.note)+'”</div>':'')+
        (d.offer!=null?'<div class="note doffer">Offered '+esc(peso(d.offer))+
          ' for the lot</div>':'')+
        '<div class="ditems">'+items+'</div>'+
        '<div class="tf-row">'+
          (d.status==='pending'
            ? '<button class="btn btn-sm btn-a" data-a="done">Mark done</button>'+
              '<button class="btn btn-sm" data-a="postponed">Postpone</button>'
            : '<button class="btn btn-sm" data-a="pending">Reopen</button>')+
          '<button class="btn btn-sm ghost" data-a="drop">Remove</button>'+
        '</div>';
      wrap.querySelectorAll('.ditem input').forEach(cb=>cb.onchange=()=>{
        d.items[+cb.dataset.i].agreed=cb.checked;save();list();renderBinder();});
      wrap.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
        const a=b.dataset.a;
        if(a==='drop')askConfirm('Remove deal',
          'Remove this deal from '+d.who+'? Any copies it holds go back to free stock.',
          'Remove',()=>{dropDeal(d.id);list();renderBinder();});
        else {setDealStatus(d.id,a);list();renderBinder();}
      });
      host.appendChild(wrap);
    });
  };

  body.querySelector('#d-load').onclick=()=>{
    chk.innerHTML='';
    let order;
    try{order=readOrder(body.querySelector('#d-in').value);}
    catch(e){toast('That is not an order code');return;}
    const bad=orderConflicts(order);
    const total=order.items.reduce((s,it)=>s+(+it.price||0)*(+it.qty||0),0);
    const head='<div class="note">'+esc(order.who)+' wants '+order.items.length+
      ' line'+(order.items.length===1?'':'s')+' · '+esc(peso(total))+
      (order.offer!=null?' · offering '+esc(peso(order.offer)):'')+'</div>';
    if(!bad.length){
      chk.innerHTML=head+'<div class="tf-row"><button class="btn btn-a btn-sm" id="d-ok">Accept</button></div>';
    }else{
      /* Nothing is decided here - the clash is put in front of you with the
         deal that already holds the copies, and you pick.                 */
      chk.innerHTML=head+
        '<div class="dwarn"><b>Not enough free stock</b>'+
        bad.map(b=>'<div>'+esc(b.name)+' '+esc(b.rar)+' — wants '+b.want+
          ', '+b.free+' free of '+b.held+
          (b.holders.length?' · held by '+esc(b.holders.join(', ')):'')+'</div>').join('')+
        '</div>'+
        '<div class="tf-row">'+
        '<button class="btn btn-a btn-sm" id="d-trim">Accept what is free</button>'+
        '<button class="btn btn-sm" id="d-force">Accept anyway</button></div>';
    }
    const take=trim=>{const d=addDeal(order,trim);chk.innerHTML='';
      body.querySelector('#d-in').value='';list();renderBinder();
      toast('Deal from '+d.who+' recorded');};
    const ok=chk.querySelector('#d-ok'); if(ok)ok.onclick=()=>take(false);
    const tr=chk.querySelector('#d-trim'); if(tr)tr.onclick=()=>take(true);
    const fo=chk.querySelector('#d-force'); if(fo)fo.onclick=()=>take(false);
  };
  list();
}

    save();};
  nm.oninput=keep;ct.oninput=keep;

/* Measure the chosen option and hand its width and offset to the pill. Called
   after anything that can change which option is on, or how wide it is.    */
function slideTabs(box){
  if(!box)return;
  const on=box.querySelector('button.on');
  if(!on||!box.clientWidth){box.style.setProperty('--to','0');return;}
  box.style.setProperty('--tw',on.offsetWidth+'px');
  box.style.setProperty('--tx',on.offsetLeft+'px');
  box.style.setProperty('--to','1');
}
const slideAllTabs=()=>document.querySelectorAll('.tabs').forEach(slideTabs);

/* ---- shareable sale page ----
   The binder as a buyer sees it: same sleeves, rarity rings and caption line,
   the same detail panel on click, and a working toolbar - sort, rarity filter,
   grid/list - because those only ever read. Every control that would change
   something is gone. Nothing on the page writes.

   Card art is referenced by URL rather than embedded. Embedding would mean
   pulling every image through a canvas at export time, which fails outright if
   the image host sends no CORS header, and turns a 200-card list into several
   megabytes. A URL that 404s costs one placeholder; a failed embed costs the
   whole file. Each image carries a fallback that keeps the name readable.  */
function saleCards(){
  const was=F.binder;F.binder='b-sell';
  const out=[];
  Object.keys(DB.own).forEach(id=>{
    const c=cardById(id); if(!c)return;
    /* Copies promised to a pending deal are still yours, but they are not
       yours to offer again - so a shared binder shows free stock only. */
    const cps=freeCopiesIn(id);
    if(!cps.length)return;
    const cores=[...coreNamesOf(c)];
    out.push({
      id:String(c.id), n:c.name, img:c.img||'', t:c.type||'', a:cores[0]||'',
      cp:cps.map(x=>{const r=rarBy(x.rarity);const srp=srpOfCopy(x,c);
        return {k:r.k,rn:r.n,f:r.f,w:r.w,s:x.set||'',c:x.cond||'',
          q:+x.qty||0,p:x.price!=null?+x.price:null,srp:srp==null?null:Math.round(srp)};})
    });
  });
  F.binder=was;
  return out;
}

const cardById=id=>DB.manual[id]||POOL.find(c=>c.id===id)||(DB.own[id]&&DB.own[id].card)||NAME_CACHE.find(c=>c.id===id);
function ensureOwn(id){
  if(!DB.own[id])DB.own[id]={card:cardById(id),copies:[],decks:[],added:Date.now()};
  return DB.own[id];
}
/* Filling in a whole set or core one card at a time is the slowest thing in the
   app. This lists everything on screen at once: type a quantity, pick a rarity
   if there is a choice, flip a row to Selling and give it a price. Rows left at
   zero are ignored, so it is safe to open, glance at and close.             */
function openBulk(){
  const list=visible();
  if(!list.length){toast('Nothing here to add');return;}
  const where=F.set?('set '+F.set):(F.arch+' core');
  const box=el('div');
  const head=el('p','hint','Set a quantity on the rows you own. Everything left at zero is skipped. '+
    list.length.toLocaleString()+' cards in '+where+'.');
  box.appendChild(head);
  const wrap=el('div','bulk');
  const rows=[];
  list.forEach(c=>{
    const pr=printingsOf(c);
    const known=RARITIES.filter(r=>pr.rars.includes(r.k));
    const menu=(known.length?known:RARITIES);
    const held=copiesIn(c.id);
    const r=el('div','brow2');
    r.innerHTML='<span class="k-nm">'+esc(c.name)+'</span>'+
      '<select class="inp k-rar">'+menu.map(x=>'<option value="'+x.k+'"'+
        (x.k===(held[0]&&held[0].rarity||pr.oneRar)?' selected':'')+'>'+esc(x.n)+'</option>').join('')+'</select>'+
      '<input class="inp k-qty" type="number" min="0" step="1" value="0" inputmode="numeric">'+
      '<label class="k-sell"><input type="checkbox"> Sell</label>'+
      '<input class="inp k-px" type="number" min="0" placeholder="price" disabled>';
    const sell=r.querySelector('.k-sell input'),px=r.querySelector('.k-px');
    sell.onchange=()=>{px.disabled=!sell.checked;if(sell.checked)px.focus();};
    rows.push({c,r,rar:r.querySelector('.k-rar'),qty:r.querySelector('.k-qty'),sell,px});
    wrap.appendChild(r);
  });
  box.appendChild(wrap);
  /* A running tally, so you can see what you are about to commit before you do.
     The selling line only appears once something is actually marked to sell.  */
  const tally=el('p','hint bulk-sum');
  tally.style.cssText='margin:9px 0 0;display:flex;gap:14px;flex-wrap:wrap';
  const retally=()=>{
    let cards=0,copies=0,keepVal=0,sellVal=0,sellCopies=0;
    rows.forEach(x=>{
      const q=Math.max(0,parseInt(x.qty.value,10)||0);
      if(!q)return;
      cards++;copies+=q;
      const srp=srpOfCopy({set:F.set&&F.set!=='\u2014'?F.set:'',rarity:x.rar.value},x.c);
      const each=x.sell.checked&&x.px.value!==''?+x.px.value:(srp||0);
      if(x.sell.checked){sellVal+=each*q;sellCopies+=q;}else{keepVal+=each*q;}
    });
    tally.innerHTML=cards
      ? `<span><b>${cards}</b> card${cards===1?'':'s'} \u00b7 <b>${copies}</b> cop${copies===1?'y':'ies'}</span>`+
        `<span>keep ${esc(peso(keepVal))}</span>`+
        (sellCopies?`<span style="color:var(--up)">selling ${sellCopies} for ${esc(peso(sellVal))}</span>`:'')
      : 'Nothing set yet \u2014 put a quantity on the rows you own.';
  };
  rows.forEach(x=>{
    x.qty.addEventListener('input',retally);
    x.sell.addEventListener('change',retally);
    x.px.addEventListener('input',retally);
    x.rar.addEventListener('change',retally);
  });
  retally();
  box.appendChild(tally);
  const saveBtn=el("button","btn btn-a","Add to binder");
  saveBtn.style.cssText="width:100%;margin-top:12px";
  saveBtn.onclick=()=>{
    let cards=0,copies=0;
    rows.forEach(x=>{
      const q=Math.max(0,parseInt(x.qty.value,10)||0);
      if(!q)return;
      const own=ensureOwn(x.c.id);
      const b=x.sell.checked?'b-sell':'b-main';
      const k=x.rar.value, set=F.set&&F.set!=='\u2014'?F.set:(printingsOf(x.c).oneSet||'');
      let hit=own.copies.find(y=>y.rarity===k&&(y.set||'')===set&&y.b===b);
      if(!hit){hit={rarity:k,set,qty:0,b};own.copies.push(hit);}
      hit.qty+=q;
      if(x.sell.checked&&x.px.value!=='')hit.price=+x.px.value;
      cards++;copies+=q;
    });
    if(!cards){toast('Nothing had a quantity');return;}
    save();closeModal();renderBinder();
    toast(copies+' cop'+(copies===1?'y':'ies')+' across '+cards+' card'+(cards===1?'':'s')+' added');
  };
  box.appendChild(saveBtn);
  modal('Bulk add \u2014 '+where,box,true);
}
/* A collector wants to look at the card, not a thumbnail of it. */
function openArt(c){

function openDetail(id){
  requestAnimationFrame(slideAllTabs);

  const c=cardById(id);if(!c)return;
  const wrap=el('div','detail');
  const artBox=el('div',null,`<div class="art"><img src="${esc(c.imgFull||c.img)}" alt="${esc(c.name)}" onerror="this.style.opacity=.12"></div>`);
  artBox.querySelector('.art').onclick=()=>openArt(c);
  artBox.querySelector('.art').title='See the card full size';
  wrap.appendChild(artBox);
  const right=el('div');
  const m=c.mon||{};
  const stats=broadType(c)==='Monster'
    ? `<div><dt>Attribute</dt><dd>${esc(m.attribute||'—')}</dd></div>
       <div><dt>Lv / Rank</dt><dd>${m.level!=null?esc(m.level):'—'}${m.scale!=null?' · scale '+esc(m.scale):''}</dd></div>
       <div><dt>Type</dt><dd>${esc(m.race||'—')}</dd></div>
       <div><dt>ATK / DEF</dt><dd>${m.atk!=null?esc(m.atk):'—'} / ${m.def!=null?esc(m.def):'—'}</dd></div>`
    : `<div><dt>Card</dt><dd>${esc(c.type||'—')}</dd></div><div><dt>Property</dt><dd>${esc(m.race||'—')}</dd></div>`;
  right.innerHTML=`<div class="nm-big">${esc(c.name)}</div>
    <div class="meta">${esc(c.type||'')}${c.archetype?' · '+esc(c.archetype):''}</div>
    <details class="cd">
      <summary>Details</summary>
      <dl class="sg">${stats}</dl>
      <div class="txt">${esc(c.desc||'No card text saved.')}</div>
    </details>
    <div class="sh">Copies held</div>
    <div id="copies"></div>
    <div class="sh">Wishlist</div>
    <div id="want"></div>
    <p class="hint shoplinks" style="margin:14px 0 0">
      <a href="${TCGC_LINK}${encodeURIComponent(c.name)}" target="_blank" rel="noopener">TCG Corner \u2197</a>
      <a href="${PC_LINK}${encodeURIComponent(c.name)}" target="_blank" rel="noopener">Players Club \u2197</a></p>`;
  wrap.appendChild(right);
  modal(c.name,wrap,true);

  /* A want is a rarity, a count and the most you will pay. The live quote sits
     beside it so the target is set against something real, not from memory. */
  const drawWant=()=>{
    const box=document.getElementById('want'); if(!box)return;
    box.innerHTML='';
    const w=wantOf(id);
    if(!w){
      const add=el('button','btn btn-sm','Add to wishlist');
      add.onclick=()=>{setWant(id,{qty:1,rarity:'',set:'',target:null});drawWant();renderBinder();};
      box.appendChild(add);
      const note=el('p','note');note.style.marginTop='7px';
      note.textContent='Track a card you are hunting and watch both shops for it.';
      box.appendChild(note);
      return;
    }
    const q=wantQuote(id),met=wantMet(id);
    const row=el('div','wrow');
    const rars=printingsOf(c).rars;
    row.innerHTML='<select class="inp c-set" id="w-rar"><option value="">Any rarity</option>'+
      RARITIES.filter(r=>!rars.length||rars.includes(r.k))
        .map(r=>'<option value="'+r.k+'"'+(w.rarity===r.k?' selected':'')+'>'+esc(r.n)+'</option>').join('')+
      '</select>'+
      '<input class="inp c-set" id="w-set" list="setlist" placeholder="Set" value="'+esc(w.set||'')+'">'+
      '<input class="inp c-price" id="w-target" inputmode="decimal" placeholder="Target \u20b1" value="'+
        (w.target==null?'':w.target)+'">'+
      '<div class="step" id="w-step"><button aria-label="One fewer">\u2212</button>'+
        '<span>'+(w.qty||1)+'</span><button aria-label="One more">+</button></div>'+
      '<button class="btn btn-sm clr" id="w-drop">Remove</button>';
    box.appendChild(row);
    const line=el('p','note wq'+(met?' met':''));
    line.innerHTML = q
      ? esc(peso(q.peso))+' at '+esc(q.shop)+(q.av?'':' \u00b7 out of stock')+
        (w.target!=null?(met?' \u00b7 <b>at or under your target</b>':' \u00b7 '+esc(peso(q.peso-w.target))+' above target'):'')
      : 'Neither shop lists this printing right now.';
    box.appendChild(line);
    row.querySelector('#w-rar').onchange=e=>{setWant(id,{rarity:e.target.value});drawWant();renderBinder();};
    row.querySelector('#w-set').onchange=e=>{setWant(id,{set:(e.target.value||'').trim().toUpperCase()});drawWant();renderBinder();};
    row.querySelector('#w-target').onchange=e=>{
      const v=e.target.value.trim();
      setWant(id,{target:v===''?null:Math.max(0,+v||0)});drawWant();renderBinder();};
    const st=row.querySelector('#w-step');
    st.children[0].onclick=()=>{const n=Math.max(1,(w.qty||1)-1);setWant(id,{qty:n});drawWant();renderBinder();};
    st.children[2].onclick=()=>{setWant(id,{qty:(w.qty||1)+1});drawWant();renderBinder();};
    row.querySelector('#w-drop').onclick=()=>{dropWant(id);drawWant();renderBinder();};
  };
  const drawCopies=()=>{
    const box=document.getElementById('copies');box.innerHTML='';
    const o=DB.own[id];
    const all=o?(o.copies||[]):[];
    /* The panel belongs to the binder you are standing in: a copy filed under
       Selling has no business showing while you are looking at the Collection.
       The index comes from the unfiltered array, because clearing a copy
       splices that array - filtering first would delete the wrong one.   */
    const mine=all.map((cp,i)=>[cp,i]).filter(([cp])=>!F.binder||cp.b===F.binder);
    if(!mine.length){
      const here=(DB.binders.find(b=>b.id===F.binder)||{}).name||'this binder';
      box.appendChild(el('p','note',all.length
        ?'Nothing in '+esc(here)+' \u2014 '+all.length+' cop'+(all.length===1?'y':'ies')+
          ' filed under the other binder.'
        :'Not marked as owned yet \u2014 add the first copy below.'));
    }
    mine.forEach(([cp,i])=>{
      const r=rarBy(cp.rarity),bn=binderOf(cp)||DB.binders[0];
      const grp=el('div','cgrp');
      if(cp.rarity)grp.dataset.r=cp.rarity;
      const row=el('div','crow');
      /* SRP is the cheaper of the two shops for this exact printing. Price your
         own copy and the SRP is struck through with the gap as a percentage,
         so it is obvious at a glance that you are not following it.        */
      const each=copyValue(cp,c);
      const mt=bestMatch(cp,c);
      const srp=mt?mt.peso:null;
      let tail;
      if(cp.price!=null&&srp){
        const d=(cp.price-srp)/srp*100;
        const cls=d<-0.5?'up':(d>0.5?'down':'flat');
        const sign=d>0?'+':'';
        tail=`<s class="srp">${esc(peso(srp))}</s> <span class="gap ${cls}">${sign}${Math.round(d)}%</span>`;
      }else if(cp.price!=null){
        tail=`<span class="srcx">yours \u00b7 no SRP</span>`;
      }else if(mt){
        /* naming the shop matters now that two are compared: the figure is
           only useful if you know which counter to walk up to. */
        const alt=mt.only?'':' \u00b7 vs '+peso(mt.other)+' at '+mt.otherShop;
        const why=mt.onStock?' \u00b7 chosen for stock':'';
        const gone=mt.av?'':' \u00b7 none in stock either side';
        tail=`<span class="srcx${mt.av?'':' none'}" `+
          `title="${esc(mt.shop)} \u00b7 ${esc(mt.code)}${esc(alt)}${esc(why)}${esc(gone)}">`+
          `SRP \u00b7 ${esc(mt.shop)}${mt.av?'':' \u00b7 out'}</span>`;
      }else{
        tail=`<span class="srcx none">no SRP \u00b7 market est.</span>`;
      }
      row.innerHTML=`<span class="tagr ${r.f}">${esc(r.k)}</span><span class="setc">${esc(r.n)}${cp.set?' \u2014 '+esc(cp.set):''}</span>
        <span class="setc" style="flex:none;text-align:right">${esc(peso(each))} ${tail}</span>`;
      const st=el('div','step');
      st.innerHTML='<button aria-label="One fewer">\u2212</button><span>'+cp.qty+'</span><button aria-label="One more">+</button>';
      st.children[0].onclick=()=>{
        cp.qty--;if(cp.qty<1)o.copies.splice(i,1);
        if(!o.copies.length&&!o.decks.length)delete DB.own[id];
        save();drawCopies();renderBinder();
      };
      st.children[2].onclick=()=>{cp.qty++;save();drawCopies();renderBinder();};
      row.appendChild(st);
      /* clearing lives beside the count it clears, rather than in a separate
         button at the foot of the panel that did the same job for every row */
      const clr=el('button','btn btn-sm clr','Clear');
      clr.title='Remove all '+cp.qty+' of this printing';
      clr.onclick=()=>askConfirm('Clear copies',
        `Remove all ${cp.qty} × ${r.n}${cp.set?' ('+cp.set+')':''} of ${c.name}?`,'Clear',()=>{
          o.copies.splice(i,1);
          if(!o.copies.length&&!o.decks.length)delete DB.own[id];
          if(DB.manual[id]&&!DB.own[id])delete DB.manual[id];
          save();renderBinder();
          if(DB.own[id])drawCopies();else closeModal();
          toast('Cleared');
        });
      row.appendChild(clr);grp.appendChild(row);

      /* second line: which binder this copy lives in, plus sale fields */
      const line2=el('div','crow-2');
      /* set picker: choose the AE set, then the card number inside it */
      const pre=el('input','inp');pre.setAttribute('list','setlist');
      pre.placeholder=aeSets().size?'Set':'Load prices';pre.classList.add('c-set');
      pre.value=setPrefix(cp.set)||'';
      pre.onchange=()=>{cp.set=(pre.value||'').trim().toUpperCase();save();drawCopies();renderBinder();};
      const setname=el('span');
      setname.className='c-setname';
      const inf=setInfo(pre.value);
      setname.textContent=inf?inf.name:(pre.value?'unlisted set':'');
      line2.appendChild(pre);line2.appendChild(setname);
      const tog=el('div','tabs');tog.style.cssText='flex:none';
      tog.innerHTML=`<button data-b="b-main"${cp.b!=='b-sell'?' class="on"':''}>Keep</button><button data-b="b-sell"${cp.b==='b-sell'?' class="on"':''}>Sell</button>`;
      tog.querySelectorAll('button').forEach(t=>t.onclick=()=>{
        if(cp.b===t.dataset.b)return;
        cp.b=t.dataset.b;save();
        /* it has just left the binder you are looking at, so its row goes too */
        const to=(DB.binders.find(b=>b.id===cp.b)||{}).name||'the other binder';
        if(F.binder&&cp.b!==F.binder)toast('Moved to '+to);
        drawCopies();renderBinder();});
      line2.appendChild(tog);
      /* An asking price is a selling concern, so the box only appears for copies
         in the Sell binder. One exception: if a price was set earlier and the
         copy moved back to Keep, the box stays so it can still be cleared.   */
      if(bn.kind==='selling'||cp.price!=null){
        const price=el('input','inp');
        price.type='number';price.min='0';price.step='1';
        /* the SRP is the useful anchor when deciding what to ask, not the
           card database's estimate, which can be off by two orders          */
        price.placeholder=srp?('SRP '+peso(srp)):'Selling price';
        price.classList.add('c-price');price.value=cp.price!=null?cp.price:'';
        price.oninput=()=>{cp.price=price.value===''?undefined:+price.value;clearTimeout(price._t);price._t=setTimeout(()=>{save();renderBinder();},350);};
        line2.appendChild(price);
      }
      if(bn.kind==='selling'){
        const cond=el('select','inp c-cond');
        cond.innerHTML='<option value="">Cond.</option>'+CONDITIONS.map(x=>`<option ${cp.cond===x?'selected':''}>${x}</option>`).join('');
        cond.onchange=()=>{cp.cond=cond.value||undefined;save();};
        line2.appendChild(cond);
      }
      grp.appendChild(line2);box.appendChild(grp);
    });

    const add=el('div');
    add.style.cssText='display:flex;gap:5px;margin-top:9px;flex-wrap:wrap';
    /* nothing to pick when the card only ever had one set or one rarity */
    const pr=printingsOf(c),has=new Set(pr.rars);
    /* if the card only has one set that wins; failing that, reuse a set you
       already hold, so adding a Sell copy of something you own keeps its code */
    const heldSet=(copiesIn(c.id).find(x=>x.set)||{}).set||'';
    /* opened from inside a set, that is the set: the card is on screen because
       it belongs to it, so there is nothing left to ask                     */
    const openSet=(F.set&&F.set!=='\u2014')?F.set:'';
    const preSet=openSet||pr.oneSet||setPrefix(heldSet)||'';
    const opt=r=>`<option value="${r.k}"${r.k===pr.oneRar?' selected':''}>${esc(r.n)}</option>`;
    const known=RARITIES.filter(r=>has.has(r.k));
    /* Only the rarities this card was actually printed in. Offering the other
       nine is clutter, and every one of them would price as nothing anyway.
       The full list is the fallback for cards the feed has never listed.     */
    const rarHtml=(known.length?known:RARITIES).map(opt).join('');
    /* Which binder the copy lands in is decided here rather than inherited from
       whichever tab you happen to be on, so a Sell listing can be created
       alongside a Keep one instead of just bumping its quantity.            */
    add.innerHTML=`<select class="inp" id="new-rar" style="flex:1;min-width:150px">${rarHtml}</select>
      <input class="inp" id="new-pre" list="setlist" placeholder="Set" value="${esc(preSet)}" style="width:110px">
      <div class="tabs" id="new-bin" style="flex:none">
        <button data-b="b-main" class="on">Keep</button><button data-b="b-sell">Sell</button>
      </div>
      <button class="btn btn-a" id="new-add">Add copy</button>`;
    box.appendChild(add);
    if(pr.oneSet||pr.oneRar){
      const bits=[];
      if(pr.oneSet)bits.push('only in '+pr.oneSet);
      if(pr.oneRar)bits.push('only as '+rarBy(pr.oneRar).n);
      const note=el('p','hint','Filled in for you — this card is '+bits.join(' and ')+'.');
      note.style.cssText='margin-top:6px';
      box.appendChild(note);
    }
    const binSeg=add.querySelector('#new-bin');
    binSeg.querySelectorAll('button').forEach(t=>t.onclick=()=>{
      binSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===t));
      slideTabs(binSeg);
    });
    if(F.binder==='b-sell')binSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.b==='b-sell'));
    requestAnimationFrame(()=>box.querySelectorAll('.tabs').forEach(slideTabs));
    add.querySelector('#new-add').onclick=()=>{
      const own=ensureOwn(id),k=add.querySelector('#new-rar').value;
      const b=(binSeg.querySelector('button.on')||{dataset:{b:'b-main'}}).dataset.b;
      /* a blank box still resolves when the card only ever had the one set */
      const set=((add.querySelector('#new-pre').value||'').trim()||preSet).toUpperCase();
      const hit=own.copies.find(x=>x.rarity===k&&(x.set||'')===set&&x.b===b);
      if(hit)hit.qty++;else own.copies.push({rarity:k,set,qty:1,b});
      save();drawCopies();renderBinder();
      toast((hit?'Another ':'')+rarBy(k).n+' filed under '+(b==='b-sell'?'Selling':'Collection'));
    };
  };
  drawCopies();drawWant();
}

/* ============ TCG Corner price feed ============
   Their Asia-English singles are listed as "CR12-AE097 Card Name (UL) (Status B)"
   with a price, so the set code keys the price directly.                     */
/* ---------------------------------------------------------------------------
   BAKED PRICE LIST  —  [code, nameIndex, [[rarity, price, inStock], ...]]
   The second field is an index into AE_NAMES, which is loaded anyway, or a
   spelled-out name for the 238 printings whose spelling is not in there.
   Grouped by card code rather than one row per printing: a code carries up to
   eight rarities and the code and name used to be repeated for every one of
   them. Grouping cost nothing and took 111 KB off the file.
   Played stock (Status A/B/C) is not baked at all, because tcgcMatch prices
   clean copies only — those 255 rows could never be chosen. No set or code is
   lost by leaving them out; that was checked, not assumed.
   Prices are in PHP, see BAKED_CUR. expandBaked() turns this back into the flat
   [code, price, name, rarity, condition] rows that indexPrices and the .json
   import both speak. Everything between the two markers is safe to replace.
   To refresh: use tools/get-prices-from-browser.js, then regroup to this shape.
   Do NOT use the Prices panel's "Copy as code" — it keeps one row per code and
   would drop the extra printings that rarity matching depends on.

/* The shop-wide product list, not the Asia-English collection. That collection
   leaves whole sets out — ROTA, CR07, SDSS and others were missing from it —
   so we page everything and keep the titles that carry an AE code.        */
const TCGC_BASE='https://tcg-corner.com/products.json';
const AE_TITLE=/^\s*[A-Za-z0-9]{2,6}-AE[SC]?\d{2,3}\s/;
const TCGC_LINK='https://tcg-corner.com/search?q=';
const KEY_PRICES='ygo-binder-tcgc-v1';
let PX={},PX_PREV={},PX_DATE='',PX_NAME={},PX_META={},PX_ROWS=[],PX_SRC='',PX_CUR='USD';
/* Cheapest clean price per printing, keyed CODE|RARITY. One code holds up to
   eight rarities, so this is the only key a change figure can honestly use. */
let PX_KEY={};
const pxKey=(code,rar)=>code+'|'+(rar||'');
/* How stale the loaded price list is, for the dot on the Sync button */
const PX_STALE_DAYS=7;
const pxAgeDays=()=>{const t=PX_DATE?Date.parse(PX_DATE+'T00:00:00Z'):NaN;
  return isNaN(t)?Infinity:Math.max(0,Math.floor((Date.now()-t)/864e5));};
const pxFresh=()=>PX_ROWS.length>0&&pxAgeDays()<=PX_STALE_DAYS;
const pxTitle=()=>{
  if(!PX_ROWS.length)return 'No prices loaded — tap to sync';
  const a=pxAgeDays();
  return PX_ROWS.length.toLocaleString()+' prices · '+(PX_SRC||'baked in')+' · '+
    (!isFinite(a)?'no date':a===0?'updated today':a===1?'1 day old':a+' days old')+
    ' · tap to sync';};
/* Shopify serves prices in the shop's own currency, which for this store is
   pesos. Guess from the numbers, but let it be corrected by hand.          */
function guessCurrency(rows){
  const v=rows.map(r=>+r[1]).filter(n=>n>0).sort((a,b)=>a-b);
  if(!v.length)return 'USD';

function parseTitle(t){

/* their rarity tags -> ours. A name can exist from Common to Prismatic Secret,

/* verified against a full 7,277-row pull of their catalogue */

  SER:'ScR',SE:'ScR',PSER:'PScR',PSE:'PScR',
  EXSER:'ExSR',ESER:'ExSR',ESE:'ExSR',
  QCSR:'QCSR',QSCR:'QCSR',QCSER:'QCSR',QCSE:'QCSR',QC:'QCSR',
  CR:'CR',COR:'CR',HR:'HGR',HGR:'HGR'};

  [/extra\s*secret/i,'ExSR'],[/collector'?s?\s*rare/i,'CR'],[/holographic/i,'HGR'],
  [/ultimate\s*rare/i,'UtR'],[/secret\s*rare/i,'ScR'],[/ultra\s*rare/i,'UR'],
  [/super\s*rare/i,'SR'],[/\bcommon\b/i,'C']];

function indexPrices(rows){

    const c=cond||'';

    const clean=String(name||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
    /* a synced list has no stock column, so anything unknown counts as
       stocked - it must not quietly demote a shop that simply did not say */
    const row={code,pre:String(code).split('-')[0],price:+price,name:clean,rar:our,tag:rar||'',cond:c,av:av==null?1:!!av};
    PX_ROWS.push(row);

    if(!(code in PX)||price<PX[code]){PX[code]=price;PX_META[code]={n:clean,r:rar||'',c};}

/* The name field is an index into AE_NAMES, or a string for the handful of
   printings whose spelling is not in the catalogue. Both are unfolded here,
   so everything downstream still sees a plain name.                      */
function expandBaked(groups){
  const out=[];
  groups.forEach(([code,n,rs])=>{
    const name=typeof n==='number'?(AE_NAMES[n]||''):n;
    rs.forEach(([rar,price,av])=>out.push([code,price,name,rar,'',av==null?1:av]));
  });

async function refreshPrices(btn){
  const say=t=>{if(btn)btn.textContent=t;};
  say('Fetching\u2026');
  const rows=[];
  try{
    /* A short page is not the end of the catalogue — their paging returns them
       mid-run — so only a run of empty pages stops us.                      */
    let empties=0;
    for(let pg=1;pg<=120&&empties<3;pg++){
      let j=null;
      for(let attempt=0;attempt<3&&!j;attempt++){
        try{
          const r=await fetch(`${TCGC_BASE}?limit=250&page=${pg}`,{cache:'no-store'});
          if(r.ok)j=await r.json();
        }catch(err){}
      }
      if(!j){empties++;continue;}
      const items=j.products||[];
      if(!items.length){empties++;continue;}
      empties=0;
      items.forEach(pr=>{
        if(!AE_TITLE.test(pr.title||''))return;
        const t=parseTitle(pr.title);
        if(!t)return;
        /* every variant is its own printing, so all of them count */
        (pr.variants||[]).forEach(v=>{
          const price=parseFloat(v.price);
          if(!price||price<=0)return;
          rows.push([t.code,price,t.name,t.rar,t.cond||'']);
        });
      });
      say('Fetching\u2026 '+rows.length);
    }
    if(!rows.length)throw new Error('nothing parsed');
    const prev={};Object.assign(prev,PX_KEY);      /* keep the old prices for the change figure */
    indexPrices(rows);
    AE_STAMP='';
    PX_PREV=Object.keys(prev).length?prev:{};
    PX_DATE=new Date().toISOString().slice(0,10);PX_SRC='synced';
    PX_CUR=DB.pxCur||guessCurrency(rows);
    await Store.set({t:PX_DATE,rows,prev:PX_PREV,cur:PX_CUR},KEY_PRICES);
    refilterPool();
    toast(rows.length.toLocaleString()+' TCG Corner prices loaded');
    snapshot();save();renderBinder();
  }catch(e){
    say('Retry');
    toast('TCG Corner prices blocked by the browser \u2014 see the note in Prices');
    priceHelp();
  }
}

/* value order: your price, then TCG Corner, then the card database */
/* One AE code can hold eight printings — RC04-AE009 runs from Ultra to
   Quarter Century Secret — so rarity is part of the key, never an afterthought. */
function tcgcMatch(cp,card){
  const want=cp&&cp.rarity?cp.rarity:null;
  if(!want)return null;                       /* without a rarity there is no single price */
  const asked=cp&&cp.set?cp.set.toUpperCase():'';
  const full=/-AE[SC]?\d/i.test(asked);
  const pre=asked?asked.split('-')[0]:'';
  let pool;
  if(full){
    pool=PX_ROWS.filter(r=>r.code===asked&&r.rar===want);
    if(!pool.length)pool=null;
  }
  if(!pool){
    const rows=card&&card.name?PX_NAME[nameKey(card.name)]:null;
    if(!rows||!rows.length)return null;
    pool=rows.filter(r=>r.rar===want);
    if(pre){
      const inSet=pool.filter(r=>r.pre===pre);
      if(inSet.length)pool=inSet;
      else return null;                       /* that set has no such printing */
    }
  }
  if(!pool.length)return null;
  /* Played stock (Status A/B/C) is a different product at a third of the price.
     Only clean copies count — no price at all beats quoting a damaged one.    */
  const use=pool.filter(r=>!r.cond);
  if(!use.length)return null;
  /* Cheapest of what is on the shelf; only if nothing is stocked does the
     cheapest unavailable listing stand in, flagged as such.            */
  const here=use.filter(r=>r.av);
  const from=here.length?here:use;
  const best=from.reduce((a,b)=>b.price<a.price?b:a);
  return {price:best.price,code:best.code,cond:'',av:!!here.length,
          how:full?'code + rarity':(pre?'set + rarity':'rarity')};
}
/* ---- Players Club HK ----
   The second shop. Their prices are HKD, ours are PHP, so nothing can be
   compared until both are in the same currency - and the rate is fetched, not
   baked, so an old file cannot quietly distort which shop looks cheaper. If
   the HKD rate is missing the shop is simply skipped rather than guessed at. */

function pcIndex(){
  if(PC_BY_CODE)return;
  PC_BY_CODE=new Map();PC_BY_NAME=new Map();
  PC_ROWS_RAW.forEach(r=>{
    const [code,rar,price,n4,av]=r;
    const name=typeof n4==='number'?(AE_NAMES[n4]||''):String(n4||'');
    const row={code,rar,price,name,av:!!av,pre:String(code).split('-')[0]};
    const ck=code+'|'+rar;
    /* the same printing can be listed twice; the cheaper one is the offer */
    const cur=PC_BY_CODE.get(ck);
    /* in stock beats cheaper: a price you cannot buy is not an offer */
    if(!cur||(row.av&&!cur.av)||(row.av===cur.av&&price<cur.price))PC_BY_CODE.set(ck,row);
    if(name){
      const nk=nameKey(name);
      if(!PC_BY_NAME.has(nk))PC_BY_NAME.set(nk,[]);
      PC_BY_NAME.get(nk).push(row);
    }
  });
}
const hkdToPeso=p=>{
  const r=+DB.fxHkd||0;
  return r>0?p*r:null;                 /* no rate, no quote */
};
/* Mirrors tcgcMatch: code+rarity first, then name+rarity narrowed by set. */
function pcMatch(cp,card){
  pcIndex();
  const want=cp&&cp.rarity?cp.rarity:null;
  if(!want)return null;
  const asked=cp&&cp.set?cp.set.toUpperCase():'';
  const full=/-AE[SC]?\d/i.test(asked);
  const pre=asked?asked.split('-')[0]:'';
  let best=null;
  if(full){
    best=PC_BY_CODE.get(asked+'|'+want)||null;
  }
  if(!best){
    const rows=(card&&card.name)?PC_BY_NAME.get(nameKey(card.name)):null;
    if(!rows||!rows.length)return null;
    let pool=rows.filter(r=>r.rar===want);
    if(pre){
      const inSet=pool.filter(r=>r.pre===pre);
      if(inSet.length)pool=inSet; else return null;
    }
    if(!pool.length)return null;
    const here=pool.filter(r=>r.av);
    const from=here.length?here:pool;
    best=from.reduce((a,b)=>b.price<a.price?b:a);
  }
  if(!best)return null;
  const peso=hkdToPeso(best.price);
  if(peso==null)return null;

/* What the card actually costs: the cheaper of the two shops, in pesos, with
   the winner named so the figure can be traced back to a listing.          */
/* Which shop to quote. Stock decides first: a lower price at a shop that has
   none of the card is not an offer, it is a memory of one. Only when both
   agree on availability - both stocked, or neither - does price decide.  */
function bestMatch(cp,card){
  const t=tcgcMatch(cp,card);
  const p=pcMatch(cp,card);
  const tp=t?shopToPeso(t.price):null;
  const pp=p?p.peso:null;
  if(tp==null&&pp==null)return null;
  const T=t?{peso:tp,shop:'TCG Corner',code:t.code,how:t.how,av:t.av!==false}:null;
  const P=p?{peso:pp,shop:'Players Club',code:p.code,how:p.how,av:p.av!==false}:null;
  if(!P)return Object.assign(T,{only:true});
  if(!T)return Object.assign(P,{only:true});
  let win,lose;
  if(T.av!==P.av){ [win,lose] = T.av?[T,P]:[P,T]; }      /* one has it, one does not */
  else { [win,lose] = T.peso<=P.peso?[T,P]:[P,T]; }      /* same footing, price decides */
  return Object.assign({},win,{only:false,other:lose.peso,otherShop:lose.shop,
    onStock:T.av!==P.av});
}

/* What printings the feed knows for a card. When there is only one set or only
   one rarity there is nothing to choose, so the form fills it in itself.
   Clean stock only, to match how tcgcMatch prices things.                     */
function printingsOf(card){
  const rows=(card&&card.name?PX_NAME[nameKey(card.name)]:null)||[];
  const live=rows.filter(r=>!r.cond);
  const sets=[...new Set(live.map(r=>r.pre).filter(Boolean))].sort();
  const rars=[...new Set(live.map(r=>r.rar).filter(Boolean))];

function buildSetCatalogue(raw){

   can walk in and buy, and it clutters the pool. Sets whose newest card predates
   AE_MODERN_FROM are treated as legacy and hidden unless you ask for them.
   A card is only hidden if legacy sets are the ONLY place it appears.       */
const AE_MODERN_FROM='2018-01-01';
let AE_LEGACY=null,AE_MODERN=null,AE_ERA_STAMP='';
function aeEra(){
  aeIndex();
  const stamp=POOL_ALL.length+'|'+PX_DATE;
  if(AE_ERA_STAMP===stamp&&AE_LEGACY)return;
  AE_ERA_STAMP=stamp;
  const d=setDates();
  AE_LEGACY=new Set();AE_MODERN=new Set();
  AE_SIZE.forEach((n,pre)=>{
    const dt=d.get(pre);
    if(!dt||dt<AE_MODERN_FROM)AE_LEGACY.add(pre);
  });
  AE_BY_SET.forEach((names,pre)=>{
    if(AE_LEGACY.has(pre))return;
    names.forEach(k=>AE_MODERN.add(k));
  });
}
const showLegacy=()=>!!DB.legacy;
function refilterPool(){

  aeEra();
  /* an AE printing per the catalogue, or stocked by TCG Corner, or already yours */
  const cat=showLegacy()?AE_ALL:AE_MODERN;
  POOL=POOL_ALL.filter(c=>{const k=nameKey(c.name);
    return cat.has(k)||PX_NAME[k]||DB.own[c.id]||DB.manual[c.id];});
  /* The card database does not carry every Asian-English printing: 276 of them,
     most already priced by TCG Corner. Without an entry you could not record
     owning one at all, so stand in a minimal card, the name and the set, which
     is all the catalogue knows. No art and no text.                       */
  const known=new Set(POOL.map(c=>nameKey(c.name)));
  cat.forEach(k=>{
    if(known.has(k))return;
    const nm=AE_NAME_BY_KEY.get(k); if(!nm)return;
    const x=extraFor(nm);
    const src=x?xImg(x[1]):'';
    POOL.push({id:'ae-'+k,name:nm,
      type:x?(x[3]||x[2]||''):'',
      desc:x?(x[8]||''):'',
      archetype:'',img:src,imgFull:src,usd:0,ocg:'',stub:true,
      mon:x?{attribute:x[4]||'',level:x[5]===''?null:+x[5],race:'',
             atk:x[6]===''?null:+x[6],def:x[7]===''?null:+x[7]}:{}});
  });
  POOL.sort((a,b)=>a.name.localeCompare(b.name));
}
async function loadPool(){
  const slot=$('#load-slot');
  slot.innerHTML='<span class="loading"><i></i>loading pool</span>';
  try{
    const r=await fetch(API+'?misc=yes');
    if(!r.ok)throw 0;
    const j=await r.json();
    const raw=(j.data||[]).filter(isOCG);
    buildSetCatalogue(raw);
    /* This binder only tracks Asian-English printings, so a card TCG Corner has
       never listed is dropped from the pool. Anything you already own or added
       by hand stays regardless, and if no price list loaded we keep everything
       rather than show an empty binder.                                       */
    POOL_ALL=raw.map(normalise);
    refilterPool();
    poolReady=true;slot.innerHTML='';
    snapshot();save();renderBinder();cacheNames();
  }catch(e){
    poolReady=false;
    slot.innerHTML='<span class="loading" style="color:var(--danger)">pool did not load</span> <button class="btn btn-sm" id="pool-retry">Retry</button>';
    const rb=document.getElementById('pool-retry');if(rb)rb.onclick=loadPool;
    renderBinder();
  }
}

/* ---- transfer code ----
   A file is the wrong shape for moving a binder off a phone: it lands in
   Downloads and still has to reach the desktop somehow. This packs the same
   data into one unbroken token you can paste into any chat or note. Only what
   you actually typed travels - the card pool is rebuilt on arrival - so the
   code stays a small fraction of the file's size.                         */
const TCODE='YGOB1.';
const b64enc=str=>{const b=new TextEncoder().encode(str);
  let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(s);};
const b64dec=code=>{const bin=atob(code);
  const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);};
const codeCopies=o=>(o.copies||[]).reduce((s,c)=>s+(+c.qty||0),0);
function transferCode(){
  const own=[];
  Object.entries(DB.own).forEach(([id,o])=>{
    const cps=(o.copies||[]).map(c=>[+c.qty||0,c.set||'',c.rarity||'',
      c.b==='b-sell'?1:0,c.price==null?'':+c.price,c.cond||'']);
    const dks=(o.decks||[]).map(d=>[d.id,+d.qty||1]);
    if(!cps.length&&!dks.length)return;
    own.push([id,(o.card&&o.card.name)||'',cps,dks]);
  });
  /* the wishlist is typed-in data too, so it rides along */
  const want=Object.entries(DB.want||{}).map(([id,w])=>
    [id,w.rarity||'',w.set||'',+w.qty||1,w.target==null?'':+w.target]);
  const deals=(DB.deals2||[]).map(d=>[d.id,d.who,d.contact||'',d.status,d.created,
    d.note||'',d.offer==null?'':d.offer,
    (d.items||[]).map(i=>[i.id,i.rar||'',i.set||'',i.qty,i.price||0,i.agreed===false?0:1])]);
  const pay={v:1,t:new Date().toISOString().slice(0,10),own,want,deals,
    decks:(DB.decks||[]).map(d=>[d.id,d.name]),
    manual:Object.values(DB.manual||{})};
  return TCODE+b64enc(JSON.stringify(pay));
}
/* Back into the shape mergeIn() already understands. */
function readCode(code){
  const raw=String(code||'').replace(/\s+/g,'');
  const i=raw.indexOf(TCODE);
  if(i<0)throw new Error('not a transfer code');
  const pay=JSON.parse(b64dec(raw.slice(i+TCODE.length)));
  if(!pay||!Array.isArray(pay.own))throw new Error('not a transfer code');
  const out={own:{},manual:{},want:{},decks:(pay.decks||[]).map(d=>({id:d[0],name:d[1]})),
    binders:[],seq:0};
  out.deals2=(pay.deals||[]).map(d=>({id:d[0],who:d[1],contact:d[2],status:d[3],
    created:d[4],note:d[5],offer:d[6]===''?null:+d[6],
    items:(d[7]||[]).map(i=>({id:String(i[0]),rar:i[1],set:i[2],qty:+i[3],
      price:+i[4],agreed:!!i[5]}))}));
  (pay.want||[]).forEach(w=>{
    out.want[w[0]]={rarity:w[1]||'',set:w[2]||'',qty:+w[3]||1,
      target:(w[4]===''||w[4]==null)?null:+w[4],added:Date.now()};
  });
  (pay.manual||[]).forEach(c=>{if(c&&c.id)out.manual[c.id]=c;});
  pay.own.forEach(row=>{
    const id=row[0],name=row[1],cps=row[2]||[],dks=row[3]||[];
    out.own[id]={card:cardById(id)||out.manual[id]||{id,name},
      copies:cps.map(c=>{
        const cp={qty:+c[0]||0,set:c[1]||'',rarity:c[2]||'',b:c[3]?'b-sell':'b-main'};
        if(c[4]!==''&&c[4]!=null)cp.price=+c[4];
        if(c[5])cp.cond=c[5];
        return cp;}),
      decks:dks.map(d=>({id:d[0],qty:+d[1]||1})),
      added:Date.now()};
  });
  return out;
}
function openTransfer(){

    }catch(e){toast('That is not a transfer code');}

function withBinders(d){
  /* any binder the user made earlier folds into the matching fixed one */
  const old=d.binders||[];
  const sellIds=new Set(old.filter(b=>b.kind==='selling').map(b=>b.id));
  d.binders=BINDERS.map(b=>Object.assign({},b));
  Object.values(d.own||{}).forEach(o=>(o.copies||[]).forEach(c=>{
    c.b=sellIds.has(c.b)||c.b==='b-sell'?'b-sell':'b-main';
  }));
  return d;
}
function migrate(saved){
  if(saved.own)return withBinders(Object.assign({own:{},manual:{},want:{},deals2:[],decks:[],binders:[],seq:0,layout:{c:6,r:2}},saved));
  const out={own:{},manual:{},decks:saved.decks||[],seq:saved.seq||0};
  Object.values(saved.cards||{}).forEach(c=>{
    const {copies,decks,added,...card}=c;
    if(String(c.id).startsWith('manual-'))out.manual[c.id]=card;
    out.own[c.id]={card,copies:copies||[],decks:decks||[],added:added||Date.now()};
  });
  return withBinders(out);
}
/* Copies are merged, never replaced: bringing a phone's binder onto a desktop
   that already holds cards must not lose either side. A copy is the same copy
   when its card, rarity, set and binder all agree.                         */
function mergeIn(inc){
  (inc.decks||[]).forEach(d=>{if(!DB.decks.some(x=>x.id===d.id))DB.decks.push(d);});
  (inc.binders||[]).forEach(b=>{if(!DB.binders.some(x=>x.id===b.id))DB.binders.push(b);});
  Object.assign(DB.manual,inc.manual||{});
  /* a deal already recorded is left alone; an unseen one is taken on */
  DB.deals2=DB.deals2||[];
  (inc.deals2||[]).forEach(d=>{if(!DB.deals2.some(x=>x.id===d.id))DB.deals2.push(d);});
  /* a want you already track keeps the lower target: it is the one you set */
  DB.want=DB.want||{};
  Object.entries(inc.want||{}).forEach(([id,w])=>{
    const cur=DB.want[id];
    if(!cur){DB.want[id]=w;return;}
    if(w.target!=null&&(cur.target==null||w.target<cur.target))cur.target=w.target;
    cur.qty=Math.max(cur.qty||1,w.qty||1);
    if(!cur.rarity&&w.rarity)cur.rarity=w.rarity;
    if(!cur.set&&w.set)cur.set=w.set;
  });
  let added=0,merged=0;
  Object.entries(inc.own||{}).forEach(([id,o])=>{
    const cur=DB.own[id];
    if(!cur){DB.own[id]=o;added++;return;}
    merged++;
    (o.copies||[]).forEach(cp=>{
      const hit=cur.copies.find(x=>x.rarity===cp.rarity&&(x.set||'')===(cp.set||'')&&x.b===cp.b);
      if(hit)hit.qty=Math.max(hit.qty,cp.qty);else cur.copies.push(cp);
    });
    (o.decks||[]).forEach(d=>{if(!cur.decks.some(x=>x.id===d.id))cur.decks.push(d);});
  });
  DB.seq=Math.max(DB.seq||0,inc.seq||0);
  save();renderBinder();
  return {added,merged};
}

    }catch(e){toast('That file is not a binder export');}

}

/* ============ filter wiring ============ */
/* The feed carries no release dates, so a set is dated by the NEWEST OCG card
   printed in it. That works because a set cannot contain a card that did not
   exist yet, and the newest one is usually new for that set. Dating by the
   oldest card instead put every reprint set in 1999, which is why it is not
   done that way.                                                           */
let SET_DATE=null,SET_DATE_STAMP='';
function setDates(){
  const stamp=PX_ROWS.length+'|'+POOL_ALL.length+'|'+PX_DATE;
  if(SET_DATE_STAMP===stamp&&SET_DATE)return SET_DATE;
  SET_DATE=new Map();SET_DATE_STAMP=stamp;
  const byName=new Map();
  (POOL_ALL.length?POOL_ALL:POOL).forEach(c=>{if(c.ocg)byName.set(nameKey(c.name),c.ocg);});
  aeIndex();
  /* the wiki's own Asian-English release date, where it has one */
  AE_DATES.forEach(([pre,d])=>SET_DATE.set(pre,d));
  /* only for the handful it does not cover, fall back to the newest card in the
     set — a rough guess, but better than no date at all                     */
  const all=new Set([...AE_SIZE.keys(),...aeSets().keys()]);
  all.forEach(pre=>{
    if(SET_DATE.get(pre))return;
    let best='';
    setMembers(pre).forEach(n=>{const d=byName.get(n);if(d&&(!best||d>best))best=d;});
    SET_DATE.set(pre,best);
  });
  return SET_DATE;
}

    p+'<b>3 &middot; Include pre-2018 sets</b><br>Brings in Asian-English printings from 2004 to 2017. '+
    'Real cards, but long out of print and rarely stocked, so they stay hidden by default.</p>';
  modal('The two binders',b);
};
$('#legacy-sets').onchange=e=>{
  DB.legacy=e.target.checked;save();refilterPool();page=0;renderBinder();
  toast(DB.legacy?'Showing sets back to 2004':'Hiding sets from before 2018');
};
$('#owned-only').onchange=e=>{
  F.ownedOnly=e.target.checked;
  page=0;renderBinder();
};
document.querySelectorAll('#view-tabs button').forEach(b=>{
  b.onclick=()=>{
    VIEW=b.dataset.v;page=0;
    F.arch='';F.set='';              /* always land on the board, not inside one */
    document.querySelectorAll('#view-tabs button').forEach(x=>x.classList.toggle('on',x===b));
    slideAllTabs();
    renderBinder();
    /* retrigger by reflow, so tapping the same tab twice still settles */
    const g=$('#page');
    if(g&&!REDUCED){g.classList.remove('vfade');void g.offsetWidth;g.classList.add('vfade');}
  };
});
/* Re-flow whenever the window changes shape, keeping your place in the binder.
   A plain resize listener misses some cases (mobile chrome collapsing, split
   screen, devtools emulation), so a ResizeObserver watches the root as well. */
let rzT;
function reflow(){clearTimeout(rzT);rzT=setTimeout(()=>{slideAllTabs();if(autoLayout(true))renderBinder();},140);}
addEventListener('resize',reflow);
addEventListener('orientationchange',reflow);
if(window.ResizeObserver)new ResizeObserver(reflow).observe(document.documentElement);
/* matchMedia fires on the exact widths gridFor() cares about and does not
   depend on resize events being delivered, which some shells do not do.   */
[500,1040,1360].forEach(w=>{
  const mq=matchMedia('(min-width:'+w+'px)');
  if(mq.addEventListener)mq.addEventListener('change',reflow);
  else if(mq.addListener)mq.addListener(reflow);
});
$('#rail-tog').onclick=()=>{DB.railHidden=!DB.railHidden;save();applyRail();renderBinder();};
$('#prev').onclick=()=>{if(page>0){page--;renderBinder('tl');bmFlip('back');}};
$('#next').onclick=()=>{page++;renderBinder('tr');bmFlip('fwd');};
$('#open-deals').onclick=openDeals;
$('#open-trade').onclick=openTrade;
$('#open-paste').onclick=openPaste;
$('#open-settings').onclick=openSettings;
$('#bm-exit').onclick=exitBinderMode;
/* Leaving fullscreen by any route - Esc, the browser's own chrome - has to
   put the furniture back, or the app is left with no header and no way out. */
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&BM)exitBinderMode();
});
/* No hover on a touch screen, so a tap near the top brings the bar down. */
$('#bm-hot').addEventListener('click',()=>bmPeek(2600));
$('#bm-hot').addEventListener('touchstart',()=>bmPeek(2600),{passive:true});
$('#jump').onchange=e=>{const n=parseInt(e.target.value,10);if(n>0)page=n-1;renderBinder();};
$('#open-manual').onclick=openManual;
document.querySelectorAll('#binder-tabs button').forEach(b=>{
  b.onclick=()=>{F.binder=b.dataset.b||'';page=0;renderBinder();};
});
$('#do-sale').onclick=doSaleList;
$('#do-transfer').onclick=openTransfer;
$('#file-in').onchange=e=>{if(e.target.files[0]){doImport(e.target.files[0]);closeModal();}e.target.value='';};

paintRarityKey();
syncCategory();
(async()=>{
  const saved=await Store.get();
  if(saved)DB=migrate(saved);
  MODE=DB.mode==='list'?'list':'grid';
  const lg=$('#legacy-sets'); if(lg)lg.checked=!!DB.legacy;
  applyTheme();
  applyDensity();
  autoLayout(false);
  applyRail();
  requestAnimationFrame(slideAllTabs);
  DB.fx=DB.fx||58;
  DB.fxHkd=DB.fxHkd||7.88;      /* pesos per HK dollar, refreshed on sync */
  await loadCachedNames();
  await loadCachedPrices();
  renderBinder();
  loadPool();
  if(PX_SRC==='synced'&&PX_DATE!==new Date().toISOString().slice(0,10))setTimeout(()=>refreshPrices(null),1500);
  refreshRate(false);        /* quietly tops up the exchange rate; no-op offline */
})();
</script>
</body>
