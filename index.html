}
/* Unpack the baked Asian-English catalogue once, into the three shapes the app
   asks of it: which cards a set holds, how big a set really is, and whether a
   card has an AE printing at all.                                          */
let AE_BY_SET=null,AE_ALL=null,AE_SIZE=null,AE_NAME_BY_KEY=null;

   reads like any other card instead of a bare name.                       */
let AE_XTRA=null;
function extraFor(name){
  if(!AE_XTRA){
    AE_XTRA=new Map();
    AE_EXTRA.forEach(r=>AE_XTRA.set(nameKey(r[0]),r));
  }
  return AE_XTRA.get(nameKey(name))||null;
}
const xImg=t=>!t?'':(t.charAt(0)==='~'?AE_IMG_BASE+t.slice(1):t);
function aeIndex(){
  if(AE_BY_SET)return;
  AE_BY_SET=new Map();AE_ALL=new Set();AE_SIZE=new Map();AE_NAME_BY_KEY=new Map();
  AE_CAT.forEach(([pre,ids])=>{
    const names=new Set();
    ids.forEach(ni=>{
      const nm=AE_NAMES[ni]; if(!nm)return;
      const k=nameKey(nm);names.add(k);AE_ALL.add(k);
      if(!AE_NAME_BY_KEY.has(k))AE_NAME_BY_KEY.set(k,nm);
    });
    AE_BY_SET.set(pre,names);
    AE_SIZE.set(pre,ids.length);

}
/* The catalogue is authoritative about what a set contains; the price feed is
   only a fallback for a set it has never heard of.                         */
function setMembers(pre){
  aeIndex();

  const cat=AE_BY_SET.get(p);

}
function setGroups(){
  const g=new Map();
  const blank=code=>({code,nums:new Set(),cards:new Set(),copies:0,value:0,total:0});
  aeEra();
  AE_SIZE.forEach((n,pre)=>{
    if(!showLegacy()&&AE_LEGACY.has(pre))return;
    const e=blank(pre);e.total=n;g.set(pre,e);
  });
  aeSets().forEach((inf,pre)=>{
    if(g.has(pre))return;                      /* the catalogue already covered it */
    const e=blank(pre);e.total=Math.max(inf.count||0,inf.max||0);g.set(pre,e);
  });
  Object.keys(DB.own).forEach(id=>{
    const card=cardById(id);
    copiesIn(id).forEach(cp=>{
      const pre=setPrefix(cp.set)||'\u2014';
      if(!g.has(pre))g.set(pre,blank(pre));
      const e=g.get(pre);
      const n=setNumber(cp.set);if(n!=null)e.nums.add(n);
      e.cards.add(id);e.copies+=(+cp.qty||0);e.value+=copyValue(cp,card)*(+cp.qty||0);
    });
  });

  if(F.ownedOnly)g.forEach((e,k)=>{if(!e.cards.size)g.delete(k);});

  const dt=x=>d.get(x.code)||'';

  const by=DB.setSort||'old';
  /* the no-set-code bucket is not a set, so it always sits last */
  return [...g.values()].sort((a,b)=>{
    if(a.code===dash)return 1; if(b.code===dash)return -1;
    if(by==='name')return a.code.localeCompare(b.code);
    if(by==='done')return done(b)-done(a)||a.code.localeCompare(b.code);
    if(by==='value')return b.value-a.value||a.code.localeCompare(b.code);
    const x=dt(a),y=dt(b);
    if(!x&&!y)return a.code.localeCompare(b.code);

}
/* one value snapshot per day, so change over time is real rather than invented */
function snapshot(){
  const d=new Date().toISOString().slice(0,10),v=Math.round(totalValue());
  DB.history=DB.history||[];
  const last=DB.history[DB.history.length-1];
  if(last&&last.d===d)last.v=v;else DB.history.push({d,v});
  if(DB.history.length>90)DB.history=DB.history.slice(-90);
}
const activeBinder=()=>DB.binders.find(b=>b.id===F.binder)||null;
const isSelling=b=>!!b&&b.kind==='selling';
const binderOf=cp=>DB.binders.find(b=>b.id===cp.b)||DB.binders[0];
/* copies in the binder currently being viewed (all of them when none is picked) */
/* Copies of a card in the binder you are looking at, and nothing else. The two
   binders stay strictly apart: three copies in Collection must not make a card
   look owned while Selling is picked. Every copy count in the app runs through
   here, so the separation holds in the grid, in Sets and in Cores alike.     */
const copiesIn=id=>{
  const o=ownOf(id);if(!o)return [];
  return F.binder?(o.copies||[]).filter(c=>c.b===F.binder):(o.copies||[]);
};
let page=0;
let VIEW='binder';
let MODE='grid';   /* grid = card images, list = rows. A display choice, not a view. */
let LAYOUT={c:6,r:2};
let PER=LAYOUT.c*LAYOUT.r;
function applyLayout(c,r,keepFirst){
  const firstCard=keepFirst?page*PER:0;
  LAYOUT={c,r};PER=c*r;
  document.documentElement.style.setProperty('--cols',c);
  document.documentElement.style.setProperty('--rows',r);
  page=Math.floor(firstCard/PER);

/* The sheet follows the window now, instead of a manual 6x2 / 4x3 / 3x3 switch.
   Phones get a tall narrow spread, wide screens the full two-row sheet.      */
/* Below this the two leaves would be a card and a half wide, so the spread
   simply does not apply - the switch stays on for when the window grows. */
const BM_MIN=900;
/* Binder mode is a wide-screen way of looking at the collection. On a phone
   the furniture it hides IS the navigation, so it is not offered there. */
const bmAllowed=()=>window.innerWidth>=BM_MIN;
const spreadOn=()=>!!DB.spread&&window.innerWidth>=760;
function gridFor(w){
  const g=w<500?{c:3,r:4}:w<1040?{c:4,r:3}:w<1360?{c:5,r:2}:{c:6,r:2};
  /* Compact buys one more column at every width. The rows stay put, so a
     page holds more without the cards being asked to shrink twice.     */
  if(DB.density==='compact')g.c+=1;
  /* two equal leaves, so an odd column count gains one */
  if(spreadOn()&&g.c%2)g.c+=1;

}
function autoLayout(keepFirst){
  const g=gridFor(document.documentElement.clientWidth);
  /* a chosen page size keeps the column count the window asked for and just
     stacks however many rows it takes to hold that many cards               */
  const want=+DB.per||0;
  const r=want?Math.max(1,Math.ceil(want/g.c)):g.r;
  if(g.c===LAYOUT.c&&r===LAYOUT.r)return false;
  applyLayout(g.c,r,keepFirst);

}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const opts=(list,ph)=>`<option value="">${ph}</option>`+list.map(v=>`<option>${v}</option>`).join('');

const ownOf=id=>DB.own[id];
const totalCopies=id=>copiesIn(id).reduce((s,x)=>s+(+x.qty||0),0);
const allCopies=id=>{const o=ownOf(id);return o?(o.copies||[]).reduce((s,x)=>s+(+x.qty||0),0):0;};
const askValue=id=>copiesIn(id).reduce((s,x)=>s+((+x.price||0)*(+x.qty||0)),0);

/* ============ list ============ */
function allCards(){
  const map=new Map();
  POOL.forEach(c=>map.set(c.id,c));
  Object.values(DB.own).forEach(o=>{if(o.card&&!map.has(o.card.id))map.set(o.card.id,o.card);});
  Object.values(DB.manual).forEach(c=>map.set(c.id,c));

}
function visible(){
  /* A deck list is its own view: every card in it shows, owned or not. So is an
     open core — you opened it to see the gaps, so the owned switch steps aside. */
  let list;
  if(F.arch){
    list=allCards().filter(c=>coreNamesOf(c).has(F.arch));
    if(F.ownedOnly)list=list.filter(c=>copiesIn(c.id).length);
  }else if(F.set){
    if(F.set==='\u2014'){
      /* the odd one out: copies you filed without a set code */
      list=allCards().filter(c=>copiesIn(c.id).some(cp=>!setPrefix(cp.set)));
    }else{
      const names=setMembers(F.set);
      list=allCards().filter(c=>names.has(nameKey(c.name)));
    }
    if(F.ownedOnly)list=list.filter(c=>copiesIn(c.id).length);
  }else if(F.deck){
    list=allCards().filter(c=>decksOf(c.id).some(d=>d.id===F.deck));
  }else if(F.ownedOnly){
    list=allCards().filter(c=>F.binder?copiesIn(c.id).length:allCopies(c.id)>0);
  }else list=allCards();
  const q=F.text.trim().toLowerCase();
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.desc||'').toLowerCase().includes(q));
  if(F.cat)list=list.filter(c=>broadType(c)===F.cat);
  if(F.sub){
    if(F.cat==='Monster')list=list.filter(c=>new RegExp(F.sub.replace('-','.'),'i').test(c.type||''));
    else list=list.filter(c=>((c.mon||{}).race||'')===F.sub);
  }
  if(F.attr)list=list.filter(c=>((c.mon||{}).attribute||'')===F.attr);
  if(F.race)list=list.filter(c=>((c.mon||{}).race||'')===F.race);
  if(F.lvl!=='')list=list.filter(c=>String((c.mon||{}).level)===String(F.lvl));
  if(F.scale!=='')list=list.filter(c=>String((c.mon||{}).scale)===String(F.scale));

     that exists in that rarity, so the filter still means something in the
     pool and inside a core                                                */
  if(F.rar)list=list.filter(c=>copiesIn(c.id).some(x=>x.rarity===F.rar)
    ||(!copiesIn(c.id).length&&printingsOf(c).rars.includes(F.rar)));

    if(s==='type')return broadType(a).localeCompare(broadType(b))||byName(a,b);
    if(s==='rarity')return ((topRarity(b.id)||{w:0}).w-(topRarity(a.id)||{w:0}).w)||byName(a,b);
    if(s==='copies')return totalCopies(b.id)-totalCopies(a.id)||byName(a,b);
    if(s==='level')return (((b.mon||{}).level)||0)-(((a.mon||{}).level)||0)||byName(a,b);
    const oa=ownOf(a.id),ob=ownOf(b.id);
    if(oa&&ob)return oa.added-ob.added;
    if(oa)return -1;

  return list;
}

/* Counts a figure up to its new value. Purely presentational: the text is set
   to the final value first, so if anything interrupts, the number is right.
   Honours prefers-reduced-motion, and skips a first paint or a large jump
   where a spinning number would just be noise.                          */
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const ROLL=new Map();
function rollTo(node,key,value,fmt){
  const from=ROLL.get(key);
  ROLL.set(key,value);
  node.textContent=fmt(value);
  if(REDUCED||from==null||from===value)return;
  const span=Math.abs(value-from);
  if(span<1||span/Math.max(1,Math.abs(value))>3)return;   /* first load, or a wholesale change */
  const t0=performance.now(),ms=520;
  const step=now=>{
    const k=Math.min(1,(now-t0)/ms);
    const e=1-Math.pow(1-k,3);
    node.textContent=fmt(from+(value-from)*e);
    if(k<1)requestAnimationFrame(step);else node.textContent=fmt(value);
  };
  requestAnimationFrame(step);
}
function paintDash(){

  const d=$('#dash');if(!d)return;
  const keep=binderValue('b-main'), sell=binderValue('b-sell');

  const h=DB.history||[];
  const prev=h.length>1?h[h.length-2].v:null;
  const diff=prev==null?null:totalValue()-prev;
  const cls=diff==null?'flat':(diff>0.5?'up':(diff<-0.5?'down':'flat'));
  const arrow=diff==null?'no earlier snapshot':(diff>0?'\u25b2 ':(diff<0?'\u25bc ':''))+
    (diff?peso(Math.abs(diff))+' since last session':'no change');
  const M=sellMargin();
  let mg;
  if(!M.n)mg='<b class="muted">\u2014</b><div class="sub2">nothing listed yet</div>';
  else if(M.srp<=0)mg='<b class="muted">\u2014</b><div class="sub2">no TCG Corner price to compare</div>';
  else{
    const pc=(M.ask-M.srp)/M.srp*100;
    const mc=pc<-0.5?'up':(pc>0.5?'down':'flat');
    mg='<b class="'+mc+'">'+(pc>0?'+':'')+Math.round(pc)+'%</b>'+
       '<div class="sub2">'+esc(peso(M.ask))+' asked \u00b7 '+esc(peso(M.srp))+' SRP</div>';
  }
  const B=biggestMover();
  const mv=B
    ? '<b class="'+(B.d>0?'up':'down')+'">'+(B.d>0?'\u25b2':'\u25bc')+esc(peso(Math.abs(B.d)))+'</b>'+
      '<div class="sub2" title="'+esc(B.name)+'">'+esc(B.name)+'</div>'
    : '<b class="muted">\u2014</b><div class="sub2">no earlier prices yet</div>';
  d.innerHTML=`
    <div>
      <div class="cap">${selling?'Selling value':'Collection value'}</div>
      <div class="big">${esc(peso(val))}</div>
      <div class="delta ${cls}">${esc(arrow)}</div>
    </div>
    <div class="cell"><div class="cap">Total assets</div><b>${esc(peso(keep+sell))}</b>
      <div class="sub2">${esc(peso(keep))} kept \u00b7 ${esc(peso(sell))} listed</div></div>
    <div class="cell"><div class="cap">Against SRP</div>${mg}</div>
    <div class="cell"><div class="cap">Biggest mover</div>${mv}</div>
`;
  const big=d.querySelector('.big');
  if(big)rollTo(big,'headline:'+F.binder,val,peso);
  const tot=d.querySelector('.cell b');
  if(tot)rollTo(tot,'total',keep+sell,peso);
  paintTopTools();}

/* ---- binder mode ----
   Full screen, no furniture: just the sheet. The bar is moved into a floating
   strip that stays out of the way until you sweep to the top of the screen.
   Nothing is duplicated, so every control keeps the handler it already had. */
let BM=false, BM_HOME=null, BM_PREV_SPREAD=false, BM_PEEK=null, BM_PREV_PER=0;
const bmChrome=()=>document.getElementById('bm-chrome');
function enterBinderMode(){
  if(BM)return;
  if(!bmAllowed()){toast('Binder mode needs a wider screen');return;}
  BM=true;
  const bar=document.querySelector('.binder>.bar');
  BM_HOME=bar?bar.parentNode:null;
  if(bar)bmChrome().appendChild(bar);
  document.body.classList.add('bm');
  /* A hand-picked page size fights a full-screen sheet, so the window decides
     while you are in here. The choice is put back on the way out.       */
  BM_PREV_PER=DB.per||0;
  DB.per=0;
  const per=$('#t-per'); if(per){per.value='';per.disabled=true;}
  /* a book needs facing leaves; remember the setting so leaving restores it */
  BM_PREV_SPREAD=!!DB.spread;
  DB.spread=true;
  autoLayout(true);renderBinder();
  /* Fullscreen needs a gesture and can be refused outright. The mode works
     either way, so a refusal is not worth reporting.                     */
  const de=document.documentElement;
  if(de.requestFullscreen)de.requestFullscreen().catch(()=>{});
  bmPeek(1600);
}
function exitBinderMode(){
  if(!BM)return;
  BM=false;
  const bar=bmChrome().querySelector('.bar');
  if(bar&&BM_HOME)BM_HOME.insertBefore(bar,BM_HOME.firstChild);
  document.body.classList.remove('bm','bm-peek');
  DB.per=BM_PREV_PER;
  const per=$('#t-per');
  if(per){per.disabled=false;per.value=DB.per?String(DB.per):'';}
  DB.spread=BM_PREV_SPREAD;
  autoLayout(true);renderBinder();
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
}
/* Show the bar briefly: on entry, and on touch, where there is no hover. */
function bmPeek(ms){
  if(!BM)return;
  document.body.classList.add('bm-peek');
  clearTimeout(BM_PEEK);
  BM_PEEK=setTimeout(()=>document.body.classList.remove('bm-peek'),ms||1800);
}
/* The leaf is laid over a page that has already been redrawn, so if the
   animation never runs the collection still reads correctly.            */
function bmFlip(dir){
  if(!BM||REDUCED)return;
  const host=document.getElementById('page');
  if(!host||host.querySelector('.bm-leaf'))return;
  const leaf=document.createElement('div');
  leaf.className='bm-leaf '+(dir==='back'?'back':'fwd');
  leaf.setAttribute('aria-hidden','true');
  host.appendChild(leaf);
  const done=()=>{if(leaf.parentNode)leaf.remove();};
  leaf.addEventListener('animationend',done,{once:true});
  setTimeout(done,900);
}

/* Measure the chosen option and hand its width and offset to the pill. Called

function copySaleList(){doSaleList();}
function copySaleListOld(list,bn){
  const lines=[bn.name,''];
  let total=0;
  list.forEach(c=>{
    copiesIn(c.id).forEach(cp=>{
      const r=rarBy(cp.rarity);
      total+=(+cp.price||0)*(+cp.qty||0);
      lines.push(`${c.name} [${r.k}]${cp.set?' '+cp.set:''}${cp.cond?' '+cp.cond:''} \u00d7${cp.qty} \u2014 ${cp.price?peso(cp.price)+' ea':'no price set'}`);
    });
  });
  lines.push('','Total: '+peso(total));
  const text=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject())
    .then(()=>toast('Sale list copied'))
    .catch(()=>{const t=el('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Sale list copied');}catch(e){toast('Could not copy \u2014 export instead');}t.remove();});
}

/* ---- shareable sale page ----
   The binder as a buyer sees it: same sleeves, rarity rings and caption line,
   the same detail panel on click, and a working toolbar - sort, rarity filter,
   grid/list - because those only ever read. Every control that would change
   something is gone. Nothing on the page writes.

   Card art is referenced by URL rather than embedded. Embedding would mean
   pulling every image through a canvas at export time, which fails outright if
   the image host sends no CORS header, and turns a 200-card list into several
   megabytes. A URL that 404s costs one placeholder; a failed embed costs the
   whole file. Each image carries a fallback that keeps the name readable.  */
function saleCards(){
  const was=F.binder;F.binder='b-sell';
  const out=[];
  Object.keys(DB.own).forEach(id=>{
    const c=cardById(id); if(!c)return;
    const cps=copiesIn(id);
    if(!cps.length)return;
    const cores=[...coreNamesOf(c)];
    out.push({
      n:c.name, img:c.img||'', t:c.type||'', a:cores[0]||'',
      cp:cps.map(x=>{const r=rarBy(x.rarity);const srp=srpOfCopy(x,c);
        return {k:r.k,rn:r.n,f:r.f,w:r.w,s:x.set||'',c:x.cond||'',
          q:+x.qty||0,p:x.price!=null?+x.price:null,srp:srp==null?null:Math.round(srp)};})
    });
  });
  F.binder=was;
  return out;
}

function paintDecks(){
  const box=$('#deck-list');box.innerHTML='';
  if(!DB.decks.length){box.appendChild(el('p','note','No decks yet. Make one, then tag cards from their detail page.'));return;}
  const all=el('button','deck-row'+(F.deck?'':' on'));
  all.innerHTML=`<span class="nm">No deck filter</span><span class="ct">${Object.keys(DB.own).length}</span>`;
  all.onclick=()=>{F.deck='';page=0;renderBinder();};
  box.appendChild(all);
  DB.decks.forEach(d=>{
    const cnt=Object.keys(DB.own).reduce((s,id)=>{const h=decksOf(id).find(x=>x.id===d.id);return s+(h?(h.qty||1):0);},0);
    const owned=Object.keys(DB.own).reduce((s,id)=>{const h=decksOf(id).find(x=>x.id===d.id);return s+(h?Math.min(allCopies(id),h.qty||1):0);},0);

    row.innerHTML=`<i class="dot" style="background:${d.color}"></i><span class="nm">${esc(d.name)}</span><span class="ct${owned<cnt?' short':''}">${owned}/${cnt}</span><span class="x" title="Delete deck">×</span>`;

          DB.decks=DB.decks.filter(x=>x.id!==d.id);
          Object.keys(DB.own).forEach(id=>{
            const o=DB.own[id];
            o.decks=(o.decks||[]).filter(x=>x.id!==d.id);
            if(!o.copies.length&&!o.decks.length)delete DB.own[id];  /* deck-only entries go too */
          });

const cardById=id=>DB.manual[id]||POOL.find(c=>c.id===id)||(DB.own[id]&&DB.own[id].card)||NAME_CACHE.find(c=>c.id===id);
function ensureOwn(id){

/* Filling in a whole set or core one card at a time is the slowest thing in the
   app. This lists everything on screen at once: type a quantity, pick a rarity
   if there is a choice, flip a row to Selling and give it a price. Rows left at
   zero are ignored, so it is safe to open, glance at and close.             */
function openBulk(){
  const list=visible();
  if(!list.length){toast('Nothing here to add');return;}
  const where=F.set?('set '+F.set):(F.arch+' core');
  const box=el('div');
  const head=el('p','hint','Set a quantity on the rows you own. Everything left at zero is skipped. '+
    list.length.toLocaleString()+' cards in '+where+'.');
  box.appendChild(head);
  const wrap=el('div','bulk');
  const rows=[];
  list.forEach(c=>{
    const pr=printingsOf(c);
    const known=RARITIES.filter(r=>pr.rars.includes(r.k));
    const menu=(known.length?known:RARITIES);
    const held=copiesIn(c.id);
    const r=el('div','brow2');
    r.innerHTML='<span class="k-nm">'+esc(c.name)+'</span>'+
      '<select class="inp k-rar">'+menu.map(x=>'<option value="'+x.k+'"'+
        (x.k===(held[0]&&held[0].rarity||pr.oneRar)?' selected':'')+'>'+esc(x.n)+'</option>').join('')+'</select>'+
      '<input class="inp k-qty" type="number" min="0" step="1" value="0" inputmode="numeric">'+
      '<label class="k-sell"><input type="checkbox"> Sell</label>'+
      '<input class="inp k-px" type="number" min="0" placeholder="price" disabled>';
    const sell=r.querySelector('.k-sell input'),px=r.querySelector('.k-px');
    sell.onchange=()=>{px.disabled=!sell.checked;if(sell.checked)px.focus();};
    rows.push({c,r,rar:r.querySelector('.k-rar'),qty:r.querySelector('.k-qty'),sell,px});
    wrap.appendChild(r);
  });
  box.appendChild(wrap);
  /* A running tally, so you can see what you are about to commit before you do.
     The selling line only appears once something is actually marked to sell.  */
  const tally=el('p','hint bulk-sum');
  tally.style.cssText='margin:9px 0 0;display:flex;gap:14px;flex-wrap:wrap';
  const retally=()=>{
    let cards=0,copies=0,keepVal=0,sellVal=0,sellCopies=0;
    rows.forEach(x=>{
      const q=Math.max(0,parseInt(x.qty.value,10)||0);
      if(!q)return;
      cards++;copies+=q;
      const srp=srpOfCopy({set:F.set&&F.set!=='\u2014'?F.set:'',rarity:x.rar.value},x.c);
      const each=x.sell.checked&&x.px.value!==''?+x.px.value:(srp||0);
      if(x.sell.checked){sellVal+=each*q;sellCopies+=q;}else{keepVal+=each*q;}
    });
    tally.innerHTML=cards
      ? `<span><b>${cards}</b> card${cards===1?'':'s'} \u00b7 <b>${copies}</b> cop${copies===1?'y':'ies'}</span>`+
        `<span>keep ${esc(peso(keepVal))}</span>`+
        (sellCopies?`<span style="color:var(--up)">selling ${sellCopies} for ${esc(peso(sellVal))}</span>`:'')
      : 'Nothing set yet \u2014 put a quantity on the rows you own.';
  };
  rows.forEach(x=>{
    x.qty.addEventListener('input',retally);
    x.sell.addEventListener('change',retally);
    x.px.addEventListener('input',retally);
    x.rar.addEventListener('change',retally);
  });
  retally();
  box.appendChild(tally);
  const saveBtn=el("button","btn btn-a","Add to binder");
  saveBtn.style.cssText="width:100%;margin-top:12px";
  saveBtn.onclick=()=>{
    let cards=0,copies=0;
    rows.forEach(x=>{
      const q=Math.max(0,parseInt(x.qty.value,10)||0);
      if(!q)return;
      const own=ensureOwn(x.c.id);
      const b=x.sell.checked?'b-sell':'b-main';
      const k=x.rar.value, set=F.set&&F.set!=='\u2014'?F.set:(printingsOf(x.c).oneSet||'');
      let hit=own.copies.find(y=>y.rarity===k&&(y.set||'')===set&&y.b===b);
      if(!hit){hit={rarity:k,set,qty:0,b};own.copies.push(hit);}
      hit.qty+=q;
      if(x.sell.checked&&x.px.value!=='')hit.price=+x.px.value;
      cards++;copies+=q;
    });
    if(!cards){toast('Nothing had a quantity');return;}
    save();closeModal();renderBinder();
    toast(copies+' cop'+(copies===1?'y':'ies')+' across '+cards+' card'+(cards===1?'':'s')+' added');
  };
  box.appendChild(saveBtn);
  modal('Bulk add \u2014 '+where,box,true);
}

function openDetail(id){
  requestAnimationFrame(slideAllTabs);

  const c=cardById(id);if(!c)return;
  const wrap=el('div','detail');
  const artBox=el('div',null,`<div class="art"><img src="${esc(c.imgFull||c.img)}" alt="${esc(c.name)}" onerror="this.style.opacity=.12"></div>`);

       <div><dt>Type</dt><dd>${esc(m.race||'—')}</dd></div>
       <div><dt>ATK / DEF</dt><dd>${m.atk!=null?esc(m.atk):'—'} / ${m.def!=null?esc(m.def):'—'}</dd></div>`
    : `<div><dt>Card</dt><dd>${esc(c.type||'—')}</dd></div><div><dt>Property</dt><dd>${esc(m.race||'—')}</dd></div>`;
  right.innerHTML=`<div class="nm-big">${esc(c.name)}</div>
    <div class="meta">${esc(c.type||'')}${c.archetype?' · '+esc(c.archetype):''}</div>
    <details class="cd">
      <summary>Details</summary>
      <dl class="sg">${stats}</dl>
      <div class="txt">${esc(c.desc||'No card text saved.')}</div>
    </details>
    <div class="sh">Copies held</div>
    <div id="copies"></div>
    <p class="hint" style="margin:14px 0 0">
      <a href="${TCGC_LINK}${encodeURIComponent(c.name)}" target="_blank" rel="noopener"
         style="color:var(--muted)">Check this card on TCG Corner \u2197</a></p>`;
  wrap.appendChild(right);
  modal(c.name,wrap,true);

  const drawCopies=()=>{
    const box=document.getElementById('copies');box.innerHTML='';
    const o=DB.own[id];
    const all=o?(o.copies||[]):[];
    /* The panel belongs to the binder you are standing in: a copy filed under
       Selling has no business showing while you are looking at the Collection.
       The index comes from the unfiltered array, because clearing a copy
       splices that array - filtering first would delete the wrong one.   */
    const mine=all.map((cp,i)=>[cp,i]).filter(([cp])=>!F.binder||cp.b===F.binder);
    if(!mine.length){
      const here=(DB.binders.find(b=>b.id===F.binder)||{}).name||'this binder';
      box.appendChild(el('p','note',all.length
        ?'Nothing in '+esc(here)+' \u2014 '+all.length+' cop'+(all.length===1?'y':'ies')+
          ' filed under the other binder.'
        :'Not marked as owned yet \u2014 add the first copy below.'));
    }
    mine.forEach(([cp,i])=>{
      const r=rarBy(cp.rarity),bn=binderOf(cp)||DB.binders[0];
      const grp=el('div','cgrp');
      if(cp.rarity)grp.dataset.r=cp.rarity;
      const row=el('div','crow');
      /* SRP is what TCG Corner asks for this exact printing. Price your own copy
         and the SRP is struck through and the gap shown as a percentage, so it
         is obvious at a glance that you are not following it.                */
      const each=copyValue(cp,c);
      const mt=tcgcMatch(cp,c);
      const srp=mt?shopToPeso(mt.price):null;
      let tail;
      if(cp.price!=null&&srp){
        const d=(cp.price-srp)/srp*100;
        const cls=d<-0.5?'up':(d>0.5?'down':'flat');
        const sign=d>0?'+':'';
        tail=`<s class="srp">${esc(peso(srp))}</s> <span class="gap ${cls}">${sign}${Math.round(d)}%</span>`;
      }else if(cp.price!=null){
        tail=`<span class="srcx">yours \u00b7 no SRP</span>`;
      }else if(mt){
        tail=`<span class="srcx">SRP \u00b7 ${esc(mt.code)}</span>`;
      }else{
        tail=`<span class="srcx none">no SRP \u00b7 market est.</span>`;
      }
      row.innerHTML=`<span class="tagr ${r.f}">${esc(r.k)}</span><span class="setc">${esc(r.n)}${cp.set?' \u2014 '+esc(cp.set):''}</span>
        <span class="setc" style="flex:none;text-align:right">${esc(peso(each))} ${tail}</span>`;
      const st=el('div','step');
      st.innerHTML='<button aria-label="One fewer">\u2212</button><span>'+cp.qty+'</span><button aria-label="One more">+</button>';
      st.children[0].onclick=()=>{
        cp.qty--;if(cp.qty<1)o.copies.splice(i,1);
        if(!o.copies.length&&!o.decks.length)delete DB.own[id];
        save();drawCopies();renderBinder();
      };
      st.children[2].onclick=()=>{cp.qty++;save();drawCopies();renderBinder();};
      row.appendChild(st);
      /* clearing lives beside the count it clears, rather than in a separate
         button at the foot of the panel that did the same job for every row */
      const clr=el('button','btn btn-sm clr','Clear');
      clr.title='Remove all '+cp.qty+' of this printing';
      clr.onclick=()=>askConfirm('Clear copies',
        `Remove all ${cp.qty} × ${r.n}${cp.set?' ('+cp.set+')':''} of ${c.name}?`,'Clear',()=>{
          o.copies.splice(i,1);
          if(!o.copies.length&&!o.decks.length)delete DB.own[id];
          if(DB.manual[id]&&!DB.own[id])delete DB.manual[id];
          save();renderBinder();
          if(DB.own[id])drawCopies();else closeModal();
          toast('Cleared');
        });
      row.appendChild(clr);grp.appendChild(row);

      /* second line: which binder this copy lives in, plus sale fields */
      const line2=el('div','crow-2');
      /* set picker: choose the AE set, then the card number inside it */
      const pre=el('input','inp');pre.setAttribute('list','setlist');
      pre.placeholder=aeSets().size?'Set':'Load prices';pre.classList.add('c-set');
      pre.value=setPrefix(cp.set)||'';
      pre.onchange=()=>{cp.set=(pre.value||'').trim().toUpperCase();save();drawCopies();renderBinder();};
      const setname=el('span');
      setname.className='c-setname';
      const inf=setInfo(pre.value);
      setname.textContent=inf?inf.name:(pre.value?'unlisted set':'');
      line2.appendChild(pre);line2.appendChild(setname);
      const tog=el('div','tabs');tog.style.cssText='flex:none';
      tog.innerHTML=`<button data-b="b-main"${cp.b!=='b-sell'?' class="on"':''}>Keep</button><button data-b="b-sell"${cp.b==='b-sell'?' class="on"':''}>Sell</button>`;
      tog.querySelectorAll('button').forEach(t=>t.onclick=()=>{
        if(cp.b===t.dataset.b)return;
        cp.b=t.dataset.b;save();
        /* it has just left the binder you are looking at, so its row goes too */
        const to=(DB.binders.find(b=>b.id===cp.b)||{}).name||'the other binder';
        if(F.binder&&cp.b!==F.binder)toast('Moved to '+to);
        drawCopies();renderBinder();});
      line2.appendChild(tog);
      /* An asking price is a selling concern, so the box only appears for copies
         in the Sell binder. One exception: if a price was set earlier and the
         copy moved back to Keep, the box stays so it can still be cleared.   */
      if(bn.kind==='selling'||cp.price!=null){
        const price=el('input','inp');
        price.type='number';price.min='0';price.step='1';
        /* the SRP is the useful anchor when deciding what to ask, not the
           card database's estimate, which can be off by two orders          */
        price.placeholder=srp?('SRP '+peso(srp)):'Selling price';
        price.classList.add('c-price');price.value=cp.price!=null?cp.price:'';
        price.oninput=()=>{cp.price=price.value===''?undefined:+price.value;clearTimeout(price._t);price._t=setTimeout(()=>{save();renderBinder();},350);};
        line2.appendChild(price);
      }
      if(bn.kind==='selling'){
        const cond=el('select','inp c-cond');
        cond.innerHTML='<option value="">Cond.</option>'+CONDITIONS.map(x=>`<option ${cp.cond===x?'selected':''}>${x}</option>`).join('');
        cond.onchange=()=>{cp.cond=cond.value||undefined;save();};
        line2.appendChild(cond);
      }
      grp.appendChild(line2);box.appendChild(grp);
    });

    const add=el('div');
    add.style.cssText='display:flex;gap:5px;margin-top:9px;flex-wrap:wrap';
    /* nothing to pick when the card only ever had one set or one rarity */
    const pr=printingsOf(c),has=new Set(pr.rars);
    /* if the card only has one set that wins; failing that, reuse a set you
       already hold, so adding a Sell copy of something you own keeps its code */
    const heldSet=(copiesIn(c.id).find(x=>x.set)||{}).set||'';
    /* opened from inside a set, that is the set: the card is on screen because
       it belongs to it, so there is nothing left to ask                     */
    const openSet=(F.set&&F.set!=='\u2014')?F.set:'';
    const preSet=openSet||pr.oneSet||setPrefix(heldSet)||'';
    const opt=r=>`<option value="${r.k}"${r.k===pr.oneRar?' selected':''}>${esc(r.n)}</option>`;
    const known=RARITIES.filter(r=>has.has(r.k));
    /* Only the rarities this card was actually printed in. Offering the other
       nine is clutter, and every one of them would price as nothing anyway.
       The full list is the fallback for cards the feed has never listed.     */
    const rarHtml=(known.length?known:RARITIES).map(opt).join('');
    /* Which binder the copy lands in is decided here rather than inherited from
       whichever tab you happen to be on, so a Sell listing can be created
       alongside a Keep one instead of just bumping its quantity.            */
    add.innerHTML=`<select class="inp" id="new-rar" style="flex:1;min-width:150px">${rarHtml}</select>
      <input class="inp" id="new-pre" list="setlist" placeholder="Set" value="${esc(preSet)}" style="width:110px">
      <div class="tabs" id="new-bin" style="flex:none">

      </div>
      <button class="btn btn-a" id="new-add">Add copy</button>`;
    box.appendChild(add);
    if(pr.oneSet||pr.oneRar){
      const bits=[];
      if(pr.oneSet)bits.push('only in '+pr.oneSet);
      if(pr.oneRar)bits.push('only as '+rarBy(pr.oneRar).n);
      const note=el('p','hint','Filled in for you — this card is '+bits.join(' and ')+'.');
      note.style.cssText='margin-top:6px';
      box.appendChild(note);
    }
    const binSeg=add.querySelector('#new-bin');
    binSeg.querySelectorAll('button').forEach(t=>t.onclick=()=>{
      binSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===t));
      slideTabs(binSeg);
    });
    if(F.binder==='b-sell')binSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.b==='b-sell'));
    requestAnimationFrame(()=>box.querySelectorAll('.tabs').forEach(slideTabs));
    add.querySelector('#new-add').onclick=()=>{
      const own=ensureOwn(id),k=add.querySelector('#new-rar').value;
      const b=(binSeg.querySelector('button.on')||{dataset:{b:'b-main'}}).dataset.b;
      /* a blank box still resolves when the card only ever had the one set */
      const set=((add.querySelector('#new-pre').value||'').trim()||preSet).toUpperCase();
      const hit=own.copies.find(x=>x.rarity===k&&(x.set||'')===set&&x.b===b);
      if(hit)hit.qty++;else own.copies.push({rarity:k,set,qty:1,b});
      save();drawCopies();renderBinder();
      toast((hit?'Another ':'')+rarBy(k).n+' filed under '+(b==='b-sell'?'Selling':'Collection'));
    };
  };
  drawCopies();
}

/* The shop-wide product list, not the Asia-English collection. That collection
   leaves whole sets out — ROTA, CR07, SDSS and others were missing from it —
   so we page everything and keep the titles that carry an AE code.        */
const TCGC_BASE='https://tcg-corner.com/products.json';
const AE_TITLE=/^\s*[A-Za-z0-9]{2,6}-AE[SC]?\d{2,3}\s/;
const TCGC_LINK='https://tcg-corner.com/search?q=';
const KEY_PRICES='ygo-binder-tcgc-v1';
let PX={},PX_PREV={},PX_DATE='',PX_NAME={},PX_META={},PX_ROWS=[],PX_SRC='',PX_CUR='USD';
/* Cheapest clean price per printing, keyed CODE|RARITY. One code holds up to
   eight rarities, so this is the only key a change figure can honestly use. */
let PX_KEY={};
const pxKey=(code,rar)=>code+'|'+(rar||'');
/* How stale the loaded price list is, for the dot on the Sync button */
const PX_STALE_DAYS=7;
const pxAgeDays=()=>{const t=PX_DATE?Date.parse(PX_DATE+'T00:00:00Z'):NaN;
  return isNaN(t)?Infinity:Math.max(0,Math.floor((Date.now()-t)/864e5));};
const pxFresh=()=>PX_ROWS.length>0&&pxAgeDays()<=PX_STALE_DAYS;
const pxTitle=()=>{
  if(!PX_ROWS.length)return 'No prices loaded — tap to sync';
  const a=pxAgeDays();
  return PX_ROWS.length.toLocaleString()+' prices · '+(PX_SRC||'baked in')+' · '+
    (!isFinite(a)?'no date':a===0?'updated today':a===1?'1 day old':a+' days old')+
    ' · tap to sync';};
/* Shopify serves prices in the shop's own currency, which for this store is
   pesos. Guess from the numbers, but let it be corrected by hand.          */
function guessCurrency(rows){
  const v=rows.map(r=>+r[1]).filter(n=>n>0).sort((a,b)=>a-b);
  if(!v.length)return 'USD';
  return v[Math.floor(v.length/2)]>60?'PHP':'USD';
}
const shopToPeso=p=>PX_CUR==='PHP'?p:p*fx();
function parseTitle(t){
  const raw=String(t||'');
  const m=raw.match(/^\s*([A-Z0-9]{2,6}-AE[SC]?\d{2,3})\s+(.*)$/i);
  if(!m)return null;
  let rest=m[2],rar='';
  /* "(Status B)" and friends mark played/damaged stock, which is much cheaper */
  const st=raw.match(/\(\s*Status\s*([A-Za-z])\s*\)/i);
  let cond=st?st[1].toUpperCase():'';
  if(/damaged|\bDMG\b|played/i.test(raw))cond=cond||'D';
  const rm=rest.replace(/\(\s*Status[^)]*\)/ig,'').match(/\(([A-Za-z]{1,6})\)/);
  if(rm)rar=rm[1].toUpperCase();
  rest=rest.replace(/\((?:Status[^)]*|[A-Za-z]{1,5})\)/gi,'').trim();
  return {code:m[1].toUpperCase(),name:rest,rar,cond};
}
/* their rarity tags -> ours. A name can exist from Common to Prismatic Secret,
   so a match must agree on rarity or it is not a match at all.               */
/* verified against a full 7,277-row pull of their catalogue */
const TCGC_RAR={C:'C',N:'C',NR:'C',R:'R',SR:'SR',UR:'UR',UL:'UtR',ULT:'UtR',
  SER:'ScR',SE:'ScR',PSER:'PScR',PSE:'PScR',
  EXSER:'ExSR',ESER:'ExSR',ESE:'ExSR',
  QCSR:'QCSR',QSCR:'QCSR',QCSER:'QCSR',QCSE:'QCSR',QC:'QCSR',
  CR:'CR',COR:'CR',HR:'HGR',HGR:'HGR'};
/* some listings spell the rarity out in the title instead of tagging it */
const RAR_WORDS=[[/quarter\s*century\s*secret/i,'QCSR'],[/prismatic\s*secret/i,'PScR'],
  [/extra\s*secret/i,'ExSR'],[/collector'?s?\s*rare/i,'CR'],[/holographic/i,'HGR'],
  [/ultimate\s*rare/i,'UtR'],[/secret\s*rare/i,'ScR'],[/ultra\s*rare/i,'UR'],
  [/super\s*rare/i,'SR'],[/\bcommon\b/i,'C']];
function ourRar(t,name){
  const m=TCGC_RAR[String(t||'').toUpperCase()];
  if(m)return m;
  const n=String(name||'');
  for(const [re,k] of RAR_WORDS)if(re.test(n))return k;
  return null;
}
function indexPrices(rows){
  PX={};PX_NAME={};PX_META={};PX_ROWS=[];PX_KEY={};
  rows.forEach(([code,price,name,rar,cond])=>{
    const c=cond||'';
    const our=ourRar(rar,name);
    const clean=String(name||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
    const row={code,pre:String(code).split('-')[0],price:+price,name:clean,rar:our,tag:rar||'',cond:c};
    PX_ROWS.push(row);
    /* PX is only for listing which sets exist, so any price will do */
    if(!(code in PX)||price<PX[code]){PX[code]=price;PX_META[code]={n:clean,r:rar||'',c};}
    if(!c&&our){const kk=pxKey(code,our);if(PX_KEY[kk]==null||+price<PX_KEY[kk])PX_KEY[kk]=+price;}
    const k=nameKey(clean);
    if(k)(PX_NAME[k]=PX_NAME[k]||[]).push(row);
  });
}
/* the baked list is grouped by code to keep the file down; everything else in
   the app speaks flat rows, so unfold it on the way in                      */
function expandBaked(groups){
  const out=[];
  groups.forEach(([code,name,rs])=>rs.forEach(([rar,price])=>out.push([code,price,name,rar,''])));
  return out;
}
async function loadCachedPrices(){
  if(BAKED_PRICES.length){indexPrices(expandBaked(BAKED_PRICES));PX_DATE=BAKED_STAMP;PX_SRC='baked in';PX_CUR=BAKED_CUR;}
  const c=await Store.get(KEY_PRICES);
  if(c&&c.rows&&c.rows.length){
    /* a synced copy is newer than whatever was baked in, so it wins */
    if(!BAKED_STAMP||!c.t||c.t>=BAKED_STAMP){
      indexPrices(c.rows);PX_PREV=c.prev||{};PX_DATE=c.t||'';PX_SRC='synced';
      PX_CUR=c.cur||DB.pxCur||guessCurrency(c.rows);
    }
  }
  AE_STAMP='';paintSetList();
}
/* hand the current list back as a paste-ready block for hardwiring */
function pricesAsCode(){
  const rows=Object.keys(PX).sort().map(code=>{
    const meta=PX_META[code]||{};
    return JSON.stringify([code,PX[code],meta.n||'',meta.r||'',meta.c||'']);
  });
  return 'const BAKED_STAMP=\''+(PX_DATE||new Date().toISOString().slice(0,10))+'\';\n'+
         'const BAKED_PRICES=[\n'+rows.join(',\n')+'\n];';
}
function exportPrices(){
  const rows=Object.keys(PX).sort().map(code=>{
    const meta=PX_META[code]||{};
    return [code,PX[code],meta.n||'',meta.r||'',meta.c||''];
  });
  const blob=new Blob([JSON.stringify({t:PX_DATE,cur:PX_CUR,rows},null,0)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);
  a.download='tcgc-prices-'+(PX_DATE||'snapshot')+'.json';
  a.click();URL.revokeObjectURL(a.href);toast(rows.length.toLocaleString()+' prices exported');
}
function importPrices(file){
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const j=JSON.parse(fr.result);
      const rows=j.rows||j;
      if(!Array.isArray(rows)||!rows.length)throw 0;
      const prev={};Object.assign(prev,PX_KEY);
      indexPrices(rows);PX_PREV=prev;PX_DATE=j.t||new Date().toISOString().slice(0,10);PX_SRC='imported';
      PX_CUR=j.cur||guessCurrency(rows);
      AE_STAMP='';paintSetList();refilterPool();
      await Store.set({t:PX_DATE,rows,prev:PX_PREV,cur:PX_CUR},KEY_PRICES);
      snapshot();save();renderBinder();
      toast(rows.length.toLocaleString()+' prices imported ('+PX_CUR+')');
    }catch(e){toast('That is not a price export');}
  };
  fr.readAsText(file);
}
async function refreshPrices(btn){
  const say=t=>{if(btn)btn.textContent=t;};
  say('Fetching\u2026');
  const rows=[];
  try{
    /* A short page is not the end of the catalogue — their paging returns them
       mid-run — so only a run of empty pages stops us.                      */
    let empties=0;
    for(let pg=1;pg<=120&&empties<3;pg++){
      let j=null;
      for(let attempt=0;attempt<3&&!j;attempt++){
        try{
          const r=await fetch(`${TCGC_BASE}?limit=250&page=${pg}`,{cache:'no-store'});
          if(r.ok)j=await r.json();
        }catch(err){}
      }
      if(!j){empties++;continue;}
      const items=j.products||[];
      if(!items.length){empties++;continue;}
      empties=0;
      items.forEach(pr=>{
        if(!AE_TITLE.test(pr.title||''))return;
        const t=parseTitle(pr.title);
        if(!t)return;
        /* every variant is its own printing, so all of them count */
        (pr.variants||[]).forEach(v=>{
          const price=parseFloat(v.price);
          if(!price||price<=0)return;
          rows.push([t.code,price,t.name,t.rar,t.cond||'']);
        });
      });
      say('Fetching\u2026 '+rows.length);
    }
    if(!rows.length)throw new Error('nothing parsed');
    const prev={};Object.assign(prev,PX_KEY);      /* keep the old prices for the change figure */
    indexPrices(rows);
    AE_STAMP='';
    PX_PREV=Object.keys(prev).length?prev:{};
    PX_DATE=new Date().toISOString().slice(0,10);PX_SRC='synced';
    PX_CUR=DB.pxCur||guessCurrency(rows);
    await Store.set({t:PX_DATE,rows,prev:PX_PREV,cur:PX_CUR},KEY_PRICES);
    refilterPool();
    toast(rows.length.toLocaleString()+' TCG Corner prices loaded');
    snapshot();save();renderBinder();
  }catch(e){
    say('Retry');
    toast('TCG Corner prices blocked by the browser \u2014 see the note in Prices');
    priceHelp();
  }
}

/* value order: your price, then TCG Corner, then the card database */
/* One AE code can hold eight printings — RC04-AE009 runs from Ultra to
   Quarter Century Secret — so rarity is part of the key, never an afterthought. */
function tcgcMatch(cp,card){
  const want=cp&&cp.rarity?cp.rarity:null;
  if(!want)return null;                       /* without a rarity there is no single price */
  const asked=cp&&cp.set?cp.set.toUpperCase():'';
  const full=/-AE[SC]?\d/i.test(asked);
  const pre=asked?asked.split('-')[0]:'';
  let pool;
  if(full){
    pool=PX_ROWS.filter(r=>r.code===asked&&r.rar===want);
    if(!pool.length)pool=null;
  }
  if(!pool){
    const rows=card&&card.name?PX_NAME[nameKey(card.name)]:null;
    if(!rows||!rows.length)return null;
    pool=rows.filter(r=>r.rar===want);
    if(pre){
      const inSet=pool.filter(r=>r.pre===pre);
      if(inSet.length)pool=inSet;
      else return null;                       /* that set has no such printing */
    }
  }
  if(!pool.length)return null;
  /* Played stock (Status A/B/C) is a different product at a third of the price.
     Only clean copies count — no price at all beats quoting a damaged one.    */
  const use=pool.filter(r=>!r.cond);
  if(!use.length)return null;
  const best=use.reduce((a,b)=>b.price<a.price?b:a);
  return {price:best.price,code:best.code,cond:'',
          how:full?'code + rarity':(pre?'set + rarity':'rarity')};
}
const tcgcPrice=(cp,card)=>{const m=tcgcMatch(cp,card);return m?m.price:null;};
/* What printings the feed knows for a card. When there is only one set or only
   one rarity there is nothing to choose, so the form fills it in itself.
   Clean stock only, to match how tcgcMatch prices things.                     */
function printingsOf(card){
  const rows=(card&&card.name?PX_NAME[nameKey(card.name)]:null)||[];
  const live=rows.filter(r=>!r.cond);
  const sets=[...new Set(live.map(r=>r.pre).filter(Boolean))].sort();
  const rars=[...new Set(live.map(r=>r.rar).filter(Boolean))];
  return {sets,rars,oneSet:sets.length===1?sets[0]:'',oneRar:rars.length===1?rars[0]:''};
}
/* Change since the previous pull. This used to look up PX by cp.set, but cp.set
   holds a set prefix ("RC04") while PX is keyed by full code ("RC04-AE009"), so
   it never once matched and the arrow never appeared. Go through tcgcMatch so
   the same printing is compared on both sides.                               */
function priceChange(cp,card){
  const m=tcgcMatch(cp,card);
  if(!m)return null;
  const prev=PX_PREV[pxKey(m.code,cp.rarity)];
  if(prev==null)return null;
  const d=m.price-prev;
  /* below five pesos this is the exchange rate wobbling, not the card moving */
  return Math.abs(shopToPeso(d))<5?null:d;
}

let SET_CAT=new Map();   /* prefix -> {code,name,count,max} */
function buildSetCatalogue(raw){
  const m=new Map();
  raw.forEach(c=>{
    (c.card_sets||[]).forEach(st=>{
      const code=String(st.set_code||'');
      const pre=(code.split('-')[0]||'').toUpperCase();
      const num=parseInt((code.split('-')[1]||'').replace(/\D/g,''),10);
      if(!pre||pre.length<2||pre.length>5)return;
      if(!m.has(pre))m.set(pre,{code:pre,name:st.set_name||pre,count:new Set(),max:0});
      const e=m.get(pre);

  });
  SET_CAT=new Map([...m.entries()].map(([k,v])=>[k,{code:v.code,name:v.name,count:v.count.size,max:v.max}]));

/* Sets are derived from the AE card codes TCG Corner actually sells, so the
   list is Asia-English only. The TCG catalogue is used purely to supply names. */
let AE_SETS=new Map(),AE_STAMP='';
function aeSets(){
  const stamp=Object.keys(PX).length+'|'+PX_DATE;
  if(stamp===AE_STAMP)return AE_SETS;
  const m=new Map();
  Object.keys(PX).forEach(code=>{
    const mm=code.match(/^([A-Z0-9]{2,6})-AE([SC]?)(\d{2,3})$/i);
    if(!mm)return;
    const pre=mm[1].toUpperCase(),num=parseInt(mm[3],10);
    if(!m.has(pre))m.set(pre,{code:pre,cards:new Set(),max:0});
    const e=m.get(pre);
    e.cards.add(code);
    if(!mm[2]&&num>e.max)e.max=num;      /* bonus-pack codes don't set the size */
  });
  AE_SETS=new Map([...m.entries()].map(([k,v])=>{
    const known=SET_CAT.get(k);
    return [k,{code:k,name:known?known.name:'Asia-English set '+k,count:v.cards.size,max:v.max}];
  }));

/* ============ scan a card with the phone camera ============ */
/* Matching is always local. Reading the text tries, in order:
   1. the browser's built-in TextDetector (on-device, no download, works offline)
   2. Tesseract from a CDN, only if the browser has no detector             */
const OCR_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const CARD_IMG=id=>'https://images.ygoprodeck.com/images/cards_small/'+id+'.jpg';
let nameIndex=null,NAME_CACHE=[];

/* --- the local card record the scanner checks against --- */
function scanPool(){
  const seen=new Set(),out=[];
  allCards().forEach(c=>{seen.add(c.id);out.push(c);});
  NAME_CACHE.forEach(c=>{if(!seen.has(c.id))out.push(c);});
  return out;
}
async function cacheNames(){
  /* Written under its own key, after the collection, and a failure here changes nothing. */
  NAME_CACHE=POOL.map(c=>({id:c.id,name:c.name,img:c.img,imgFull:c.imgFull}));
  try{ await Store.set({t:Date.now(),n:POOL.map(c=>c.id+'|'+c.name),
    s:[...SET_CAT.values()].map(x=>[x.code,x.name,x.count,x.max])},KEY_NAMES); }catch(e){}
}
async function loadCachedNames(){
  const c=await Store.get(KEY_NAMES);
  if(!c||!c.n)return;
  if(c.s&&c.s.length){
    SET_CAT=new Map(c.s.map(([code,name,count,max])=>[code,{code,name,count,max}]));
    paintSetList();
  }
  NAME_CACHE=c.n.map(row=>{
    const i=row.indexOf('|'),id=row.slice(0,i);
    return {id,name:row.slice(i+1),img:CARD_IMG(id),imgFull:CARD_IMG(id),type:'',desc:'',archetype:'',mon:{}};
  });
  nameIndex=null;
}

/* --- normalising: fold the letter/number pairs OCR habitually confuses --- */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const fold=s=>norm(s).replace(/rn/g,'m').replace(/[01il|]/g,c=>(c==='0'?'o':'i')).replace(/5/g,'s').replace(/8/g,'b').replace(/\s+/g,' ');
function bigrams(s){const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o;}
function dice(a,b){
  const A=bigrams(a),B=bigrams(b);
  if(!A.size||!B.size)return 0;
  let hit=0;A.forEach(g=>{if(B.has(g))hit++;});
  return 2*hit/(A.size+B.size);
}
function buildIndex(){
  if(nameIndex)return nameIndex;
  nameIndex=new Map();
  scanPool().forEach(c=>{
    fold(c.name).split(' ').forEach(w=>{
      if(w.length<3)return;
      if(!nameIndex.has(w))nameIndex.set(w,[]);
      nameIndex.get(w).push(c);
    });
  });
  return nameIndex;
}
function matchCard(text){
  const idx=buildIndex();
  const junk=/\b(atk|def|monster|spell|trap|tuner|effect|pendulum|scaie|link)\b/;
  const lines=text.split(/\n+/).map(fold).filter(l=>l.length>=4&&!junk.test(l));
  const scores=new Map();
  lines.forEach(line=>{
    const cands=new Set();
    line.split(' ').forEach(w=>{if(w.length>=3&&idx.has(w))idx.get(w).forEach(c=>cands.add(c));});
    cands.forEach(c=>{
      const sc=dice(line,fold(c.name));
      if(sc>(scores.get(c)||0))scores.set(c,sc);
    });
  });
  return [...scores.entries()].filter(([,sc])=>sc>0.55).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

/* --- preprocess: upscale, grey out, harden contrast; the name bar alone reads best --- */
async function prep(file){
  const bmp=await createImageBitmap(file);
  const w=Math.min(1600,Math.max(900,bmp.width)),h=Math.round(bmp.height*(w/bmp.width));
  const make=(sy,sh)=>{
    const cv=document.createElement('canvas');cv.width=w;cv.height=Math.round(sh);
    const cx=cv.getContext('2d');
    cx.drawImage(bmp,0,Math.round(sy*bmp.height/h),bmp.width,Math.round(sh*bmp.height/h),0,0,w,Math.round(sh));
    const d=cx.getImageData(0,0,cv.width,cv.height),px=d.data;
    for(let i=0;i<px.length;i+=4){
      let v=(px[i]*.3+px[i+1]*.59+px[i+2]*.11);
      v=v<118?Math.max(0,v-45):Math.min(255,v+45);   /* push apart, don't hard threshold */
      px[i]=px[i+1]=px[i+2]=v;
    }
    cx.putImageData(d,0,0);
    return cv;
  };
  return {strip:make(0,h*0.20),full:make(0,h)};
}
async function readText(canvas,onNote){
  if('TextDetector' in window){
    try{
      const det=new window.TextDetector();
      const blocks=await det.detect(canvas);
      if(blocks&&blocks.length)return {text:blocks.map(b=>b.rawValue).join('\n'),via:'device'};
    }catch(e){}
  }
  onNote&&onNote();
  const T=await new Promise((res,rej)=>{
    if(window.Tesseract)return res(window.Tesseract);
    const sc=document.createElement('script');
    sc.src=OCR_CDN;sc.onload=()=>res(window.Tesseract);sc.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(sc);
  });
  const {data}=await T.recognize(canvas,'eng');
  return {text:data.text||'',via:'download'};
}

    }

/* ============ export / import ============ */
function doExport(){

/* ---- transfer code ----
   A file is the wrong shape for moving a binder off a phone: it lands in
   Downloads and still has to reach the desktop somehow. This packs the same
   data into one unbroken token you can paste into any chat or note. Only what
   you actually typed travels - the card pool is rebuilt on arrival - so the
   code stays a small fraction of the file's size.                         */
const TCODE='YGOB1.';
const b64enc=str=>{const b=new TextEncoder().encode(str);
  let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(s);};
const b64dec=code=>{const bin=atob(code);
  const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);};
const codeCopies=o=>(o.copies||[]).reduce((s,c)=>s+(+c.qty||0),0);
function transferCode(){
  const own=[];
  Object.entries(DB.own).forEach(([id,o])=>{
    const cps=(o.copies||[]).map(c=>[+c.qty||0,c.set||'',c.rarity||'',
      c.b==='b-sell'?1:0,c.price==null?'':+c.price,c.cond||'']);
    const dks=(o.decks||[]).map(d=>[d.id,+d.qty||1]);
    if(!cps.length&&!dks.length)return;
    own.push([id,(o.card&&o.card.name)||'',cps,dks]);
  });
  const pay={v:1,t:new Date().toISOString().slice(0,10),own,
    decks:(DB.decks||[]).map(d=>[d.id,d.name]),
    manual:Object.values(DB.manual||{})};
  return TCODE+b64enc(JSON.stringify(pay));
}
/* Back into the shape mergeIn() already understands. */
function readCode(code){
  const raw=String(code||'').replace(/\s+/g,'');
  const i=raw.indexOf(TCODE);
  if(i<0)throw new Error('not a transfer code');
  const pay=JSON.parse(b64dec(raw.slice(i+TCODE.length)));
  if(!pay||!Array.isArray(pay.own))throw new Error('not a transfer code');
  const out={own:{},manual:{},decks:(pay.decks||[]).map(d=>({id:d[0],name:d[1]})),
    binders:[],seq:0};
  (pay.manual||[]).forEach(c=>{if(c&&c.id)out.manual[c.id]=c;});
  pay.own.forEach(row=>{
    const id=row[0],name=row[1],cps=row[2]||[],dks=row[3]||[];
    out.own[id]={card:cardById(id)||out.manual[id]||{id,name},
      copies:cps.map(c=>{
        const cp={qty:+c[0]||0,set:c[1]||'',rarity:c[2]||'',b:c[3]?'b-sell':'b-main'};
        if(c[4]!==''&&c[4]!=null)cp.price=+c[4];
        if(c[5])cp.cond=c[5];
        return cp;}),
      decks:dks.map(d=>({id:d[0],qty:+d[1]||1})),
      added:Date.now()};
  });
  return out;
}
function openTransfer(){
  const box=el('div');
  const code=transferCode();
  const cards=Object.keys(DB.own).length;
  const cps=Object.values(DB.own).reduce((s,o)=>s+codeCopies(o),0);
  box.innerHTML=
    '<p class="note">Moves what you have marked — copies, prices and decks — from one '+
    'device to another. Card art and prices are not in the code; they are rebuilt on '+
    'arrival. Nothing is sent anywhere: it is only text on your clipboard.</p>'+
    '<h4 class="tf-h">Take it off this device</h4>'+
    '<p class="note">'+cards+' card'+(cards===1?'':'s')+', '+cps+' cop'+(cps===1?'y':'ies')+
    ' · '+code.length.toLocaleString()+' characters</p>'+
    '<textarea class="tf-code" id="tf-out" readonly rows="3"></textarea>'+
    '<div class="tf-row"><button class="btn btn-sm" id="tf-copy">Copy code</button>'+
    '<button class="btn btn-sm ghost" id="tf-file">Save as file instead</button></div>'+
    '<h4 class="tf-h">Bring one in</h4>'+
    '<p class="note">Paste a code from your other device. Copies are merged with what is '+
    'already here, so nothing on either side is lost.</p>'+
    '<textarea class="tf-code" id="tf-in" rows="3" placeholder="'+TCODE+'…"></textarea>'+
    '<div class="tf-row"><button class="btn btn-sm" id="tf-load">Load code</button>'+
    '<button class="btn btn-sm ghost" id="tf-loadfile">Load a file instead</button></div>';
  const body=modal('Transfer between devices',box);
  const out=body.querySelector('#tf-out');out.value=code;out.scrollTop=0;
  body.querySelector('#tf-copy').onclick=()=>{
    (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject())
      .then(()=>toast('Transfer code copied'))
      .catch(()=>{out.focus();out.select();out.setSelectionRange(0,code.length);
        try{document.execCommand('copy');toast('Transfer code copied');}
        catch(e){toast('Select the code and copy it by hand');}});
  };
  body.querySelector('#tf-file').onclick=doExport;
  body.querySelector('#tf-loadfile').onclick=()=>$('#file-in').click();
  body.querySelector('#tf-load').onclick=()=>{
    const v=body.querySelector('#tf-in').value;
    if(!v.trim()){toast('Paste a code first');return;}
    try{
      const r=mergeIn(readCode(v));
      closeModal();
      toast('Merged in — '+r.added+' new, '+r.merged+' already here');
    }catch(e){toast('That is not a transfer code');}
  };
}
function withBinders(d){
  /* any binder the user made earlier folds into the matching fixed one */
  const old=d.binders||[];
  const sellIds=new Set(old.filter(b=>b.kind==='selling').map(b=>b.id));
  d.binders=BINDERS.map(b=>Object.assign({},b));
  Object.values(d.own||{}).forEach(o=>(o.copies||[]).forEach(c=>{
    c.b=sellIds.has(c.b)||c.b==='b-sell'?'b-sell':'b-main';
  }));
  return d;
}
function migrate(saved){
  if(saved.own)return withBinders(Object.assign({own:{},manual:{},decks:[],binders:[],seq:0,layout:{c:6,r:2}},saved));
  const out={own:{},manual:{},decks:saved.decks||[],seq:saved.seq||0};
  Object.values(saved.cards||{}).forEach(c=>{
    const {copies,decks,added,...card}=c;
    if(String(c.id).startsWith('manual-'))out.manual[c.id]=card;
    out.own[c.id]={card,copies:copies||[],decks:decks||[],added:added||Date.now()};
  });
  return withBinders(out);
}
/* Copies are merged, never replaced: bringing a phone's binder onto a desktop
   that already holds cards must not lose either side. A copy is the same copy
   when its card, rarity, set and binder all agree.                         */
function mergeIn(inc){
  (inc.decks||[]).forEach(d=>{if(!DB.decks.some(x=>x.id===d.id))DB.decks.push(d);});
  (inc.binders||[]).forEach(b=>{if(!DB.binders.some(x=>x.id===b.id))DB.binders.push(b);});
  Object.assign(DB.manual,inc.manual||{});
  let added=0,merged=0;
  Object.entries(inc.own||{}).forEach(([id,o])=>{
    const cur=DB.own[id];
    if(!cur){DB.own[id]=o;added++;return;}
    merged++;
    (o.copies||[]).forEach(cp=>{
      const hit=cur.copies.find(x=>x.rarity===cp.rarity&&(x.set||'')===(cp.set||'')&&x.b===cp.b);
      if(hit)hit.qty=Math.max(hit.qty,cp.qty);else cur.copies.push(cp);
    });
    (o.decks||[]).forEach(d=>{if(!cur.decks.some(x=>x.id===d.id))cur.decks.push(d);});
  });
  DB.seq=Math.max(DB.seq||0,inc.seq||0);
  save();renderBinder();
  return {added,merged};
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const r=mergeIn(migrate(JSON.parse(fr.result)));
      toast('Binder merged in \u2014 '+r.added+' new, '+r.merged+' already here');
    }catch(e){toast('That file is not a binder export');}
  };
  fr.readAsText(file);
}

/* ============ filter wiring ============ */
/* The feed carries no release dates, so a set is dated by the NEWEST OCG card
   printed in it. That works because a set cannot contain a card that did not
   exist yet, and the newest one is usually new for that set. Dating by the
   oldest card instead put every reprint set in 1999, which is why it is not
   done that way.                                                           */
let SET_DATE=null,SET_DATE_STAMP='';
function setDates(){
  const stamp=PX_ROWS.length+'|'+POOL_ALL.length+'|'+PX_DATE;
  if(SET_DATE_STAMP===stamp&&SET_DATE)return SET_DATE;
  SET_DATE=new Map();SET_DATE_STAMP=stamp;
  const byName=new Map();
  (POOL_ALL.length?POOL_ALL:POOL).forEach(c=>{if(c.ocg)byName.set(nameKey(c.name),c.ocg);});
  aeIndex();
  /* the wiki's own Asian-English release date, where it has one */
  AE_DATES.forEach(([pre,d])=>SET_DATE.set(pre,d));
  /* only for the handful it does not cover, fall back to the newest card in the
     set — a rough guess, but better than no date at all                     */
  const all=new Set([...AE_SIZE.keys(),...aeSets().keys()]);
  all.forEach(pre=>{
    if(SET_DATE.get(pre))return;
    let best='';
    setMembers(pre).forEach(n=>{const d=byName.get(n);if(d&&(!best||d>best))best=d;});
    SET_DATE.set(pre,best);
  });
  return SET_DATE;
}

/* Re-flow whenever the window changes shape, keeping your place in the binder.
   A plain resize listener misses some cases (mobile chrome collapsing, split
   screen, devtools emulation), so a ResizeObserver watches the root as well. */
let rzT;
function reflow(){clearTimeout(rzT);rzT=setTimeout(()=>{slideAllTabs();if(autoLayout(true))renderBinder();},140);}
addEventListener('resize',reflow);
addEventListener('orientationchange',reflow);
if(window.ResizeObserver)new ResizeObserver(reflow).observe(document.documentElement);
/* matchMedia fires on the exact widths gridFor() cares about and does not
   depend on resize events being delivered, which some shells do not do.   */
[500,1040,1360].forEach(w=>{
  const mq=matchMedia('(min-width:'+w+'px)');
  if(mq.addEventListener)mq.addEventListener('change',reflow);
  else if(mq.addListener)mq.addListener(reflow);
});
